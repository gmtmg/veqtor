<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#10101e"/>
    </linearGradient>
    <linearGradient id="git-color" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05033"/>
      <stop offset="100%" stop-color="#f14e32"/>
    </linearGradient>
    <linearGradient id="gh-color" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="760" height="400" rx="12" fill="url(#hbg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="760" y2="100"/><line x1="0" y1="200" x2="760" y2="200"/>
    <line x1="0" y1="300" x2="760" y2="300"/>
    <line x1="190" y1="0" x2="190" y2="400"/><line x1="380" y1="0" x2="380" y2="400"/>
    <line x1="570" y1="0" x2="570" y2="400"/>
  </g>

  <!-- Title -->
  <text x="380" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#f05033" opacity="0.9" letter-spacing="0.1em">GIT vs GITHUB</text>

  <!-- Divider -->
  <line x1="380" y1="55" x2="380" y2="370" stroke="#1e1e30" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== Left: Git ===== -->
  <text x="190" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f05033" opacity="0.85">Git（道具）</text>

  <!-- Diary notebook icon -->
  <g transform="translate(190,150)">
    <rect x="-50" y="-40" width="100" height="80" rx="6" fill="#141425" stroke="#f05033" stroke-width="1.5"/>
    <!-- Notebook spine -->
    <line x1="-35" y1="-40" x2="-35" y2="40" stroke="#f05033" stroke-width="1" opacity="0.5"/>
    <!-- Lines in notebook -->
    <line x1="-25" y1="-20" x2="40" y2="-20" stroke="#f05033" stroke-width="0.7" opacity="0.3"/>
    <line x1="-25" y1="-6" x2="40" y2="-6" stroke="#f05033" stroke-width="0.7" opacity="0.3"/>
    <line x1="-25" y1="8" x2="40" y2="8" stroke="#f05033" stroke-width="0.7" opacity="0.3"/>
    <line x1="-25" y1="22" x2="30" y2="22" stroke="#f05033" stroke-width="0.7" opacity="0.3"/>
    <!-- Git logo -->
    <rect x="-12" y="-12" width="24" height="24" rx="3" transform="rotate(45)" fill="none" stroke="#f05033" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Local machine box -->
  <g transform="translate(190,150)">
    <rect x="-72" y="-60" width="144" height="120" rx="10" fill="none" stroke="#f05033" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
    <text x="0" y="-48" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f05033" opacity="0.5">Your PC</text>
  </g>

  <!-- Git description -->
  <g transform="translate(190,240)" font-family="sans-serif" font-size="10" fill="#a0a0b0" opacity="0.75">
    <text x="-80" y="0" fill="#f05033">= バージョン管理ソフト</text>
    <text x="-80" y="22">自分のPC上で動く</text>
    <text x="-80" y="40">変更履歴を記録する「道具」</text>
    <text x="-80" y="58">ネット不要で使える</text>
  </g>

  <!-- Analogy -->
  <g transform="translate(190,330)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#f05033" fill-opacity="0.08" stroke="#f05033" stroke-width="1" opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#f05033" opacity="0.8">= 日記帳</text>
  </g>

  <!-- ===== Right: GitHub ===== -->
  <text x="570" y="68" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#8b5cf6" opacity="0.85">GitHub（場所）</text>

  <!-- Cloud / SNS icon -->
  <g transform="translate(570,150)">
    <!-- Cloud shape -->
    <ellipse cx="0" cy="-10" rx="55" ry="32" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
    <!-- People icons inside -->
    <g opacity="0.7">
      <circle cx="-20" cy="-14" r="6" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
      <circle cx="0" cy="-14" r="6" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
      <circle cx="20" cy="-14" r="6" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
    </g>
    <!-- Connection lines between people -->
    <line x1="-14" y1="-14" x2="-6" y2="-14" stroke="#8b5cf6" stroke-width="0.8" opacity="0.4"/>
    <line x1="6" y1="-14" x2="14" y2="-14" stroke="#8b5cf6" stroke-width="0.8" opacity="0.4"/>
    <!-- GitHub cat icon hint -->
    <circle cx="0" cy="10" r="10" fill="none" stroke="#8b5cf6" stroke-width="1.2" opacity="0.5"/>
    <circle cx="-3" cy="8" r="1.5" fill="#8b5cf6" opacity="0.5"/>
    <circle cx="3" cy="8" r="1.5" fill="#8b5cf6" opacity="0.5"/>
  </g>

  <!-- Cloud box -->
  <g transform="translate(570,150)">
    <rect x="-72" y="-60" width="144" height="120" rx="10" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
    <text x="0" y="-48" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8b5cf6" opacity="0.5">Cloud</text>
  </g>

  <!-- GitHub description -->
  <g transform="translate(570,240)" font-family="sans-serif" font-size="10" fill="#a0a0b0" opacity="0.75">
    <text x="-80" y="0" fill="#8b5cf6">= クラウド共有サービス</text>
    <text x="-80" y="22">みんなでコードを共有する「場所」</text>
    <text x="-80" y="40">Pull Requestでレビュー</text>
    <text x="-80" y="58">インターネット上で動く</text>
  </g>

  <!-- Analogy -->
  <g transform="translate(570,330)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#8b5cf6" opacity="0.8">= SNS</text>
  </g>

  <!-- Arrow connecting both sides -->
  <g transform="translate(380,155)">
    <line x1="-90" y1="0" x2="-10" y2="0" stroke="#f05033" stroke-width="1.2" opacity="0.4"/>
    <polygon points="-10,-3 -4,0 -10,3" fill="#f05033" opacity="0.4"/>
    <line x1="10" y1="0" x2="90" y2="0" stroke="#8b5cf6" stroke-width="1.2" opacity="0.4"/>
    <polygon points="90,-3 96,0 90,3" fill="#8b5cf6" opacity="0.4"/>
    <text x="0" y="-10" text-anchor="middle" font-family="monospace" font-size="8" fill="#a0a0b0" opacity="0.5">push / pull</text>
  </g>

  <!-- Bottom summary -->
  <g transform="translate(380,375)">
    <rect x="-220" y="-14" width="440" height="28" rx="14" fill="#f05033" fill-opacity="0.05" stroke="#f05033" stroke-width="0.8" opacity="0.4"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#a0a0b0" opacity="0.7">Git = ローカルの道具 / GitHub = クラウドの共有場所</text>
  </g>
</svg>
