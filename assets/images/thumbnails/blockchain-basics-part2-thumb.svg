<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <radialGradient id="glowL" cx="20%" cy="40%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glowR" cx="80%" cy="60%" r="35%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="contractGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="merkleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <rect width="640" height="360" fill="url(#glowL)"/>
  <rect width="640" height="360" fill="url(#glowR)"/>

  <!-- Key Pair (left) -->
  <g transform="translate(130,130)">
    <!-- Private key -->
    <g opacity="0.85">
      <rect x="-45" y="-35" width="40" height="70" rx="5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="-25" y="-18" text-anchor="middle" font-family="monospace" font-size="6" fill="#f59e0b" opacity="0.7">SECRET</text>
      <line x1="-40" y1="-10" x2="-10" y2="-10" stroke="#f59e0b" stroke-width="0.5" opacity="0.3"/>
      <!-- Key icon -->
      <circle cx="-25" cy="2" r="6" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
      <line x1="-19" y1="2" x2="-10" y2="2" stroke="#fbbf24" stroke-width="1.2"/>
      <line x1="-13" y1="2" x2="-13" y2="6" stroke="#fbbf24" stroke-width="1"/>
      <text x="-25" y="22" text-anchor="middle" font-family="monospace" font-size="5" fill="#fbbf24" opacity="0.5">0x9f3...</text>
    </g>
    <!-- Public key -->
    <g opacity="0.85">
      <rect x="5" y="-35" width="40" height="70" rx="5" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
      <text x="25" y="-18" text-anchor="middle" font-family="monospace" font-size="6" fill="#00d4ff" opacity="0.7">PUBLIC</text>
      <line x1="10" y1="-10" x2="40" y2="-10" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
      <!-- Lock icon -->
      <rect x="19" y="0" width="12" height="10" rx="2" stroke="#67e8f9" stroke-width="1" fill="none"/>
      <path d="M22,0 L22,-4 A3,3 0 0 1 28,-4 L28,0" stroke="#67e8f9" stroke-width="1" fill="none"/>
      <text x="25" y="22" text-anchor="middle" font-family="monospace" font-size="5" fill="#67e8f9" opacity="0.5">0x4a1...</text>
    </g>
    <text x="0" y="52" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b" opacity="0.5">KEY PAIR</text>
  </g>

  <!-- Merkle Tree (center) -->
  <g transform="translate(320,120)">
    <!-- Root -->
    <rect x="-18" y="-15" width="36" height="18" rx="3" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.8"/>
    <text x="0" y="-2" text-anchor="middle" font-family="monospace" font-size="6" fill="#10b981">Root</text>
    <!-- Level 1 -->
    <line x1="-8" y1="3" x2="-35" y2="20" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>
    <line x1="8" y1="3" x2="35" y2="20" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>
    <rect x="-50" y="20" width="30" height="14" rx="2" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6"/>
    <text x="-35" y="30" text-anchor="middle" font-family="monospace" font-size="5" fill="#6ee7b7" opacity="0.6">H(AB)</text>
    <rect x="20" y="20" width="30" height="14" rx="2" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6"/>
    <text x="35" y="30" text-anchor="middle" font-family="monospace" font-size="5" fill="#6ee7b7" opacity="0.6">H(CD)</text>
    <!-- Level 2 -->
    <line x1="-42" y1="34" x2="-58" y2="48" stroke="#10b981" stroke-width="0.6" opacity="0.4"/>
    <line x1="-28" y1="34" x2="-15" y2="48" stroke="#10b981" stroke-width="0.6" opacity="0.4"/>
    <line x1="28" y1="34" x2="15" y2="48" stroke="#10b981" stroke-width="0.6" opacity="0.4"/>
    <line x1="42" y1="34" x2="58" y2="48" stroke="#10b981" stroke-width="0.6" opacity="0.4"/>
    <rect x="-68" y="48" width="22" height="12" rx="2" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
    <text x="-57" y="57" text-anchor="middle" font-family="monospace" font-size="4.5" fill="#6ee7b7" opacity="0.5">H(A)</text>
    <rect x="-25" y="48" width="22" height="12" rx="2" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
    <text x="-14" y="57" text-anchor="middle" font-family="monospace" font-size="4.5" fill="#6ee7b7" opacity="0.5">H(B)</text>
    <rect x="5" y="48" width="22" height="12" rx="2" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
    <text x="16" y="57" text-anchor="middle" font-family="monospace" font-size="4.5" fill="#6ee7b7" opacity="0.5">H(C)</text>
    <rect x="47" y="48" width="22" height="12" rx="2" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.4"/>
    <text x="58" y="57" text-anchor="middle" font-family="monospace" font-size="4.5" fill="#6ee7b7" opacity="0.5">H(D)</text>
    <text x="0" y="78" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" opacity="0.5">MERKLE TREE</text>
  </g>

  <!-- Smart Contract (right) -->
  <g transform="translate(510,130)">
    <rect x="-40" y="-35" width="80" height="70" rx="5" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.8"/>
    <text x="0" y="-18" text-anchor="middle" font-family="monospace" font-size="7" fill="#7c3aed" opacity="0.7">CONTRACT</text>
    <line x1="-32" y1="-10" x2="32" y2="-10" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
    <!-- Code lines -->
    <text x="-28" y="2" font-family="monospace" font-size="5.5" fill="#a78bfa" opacity="0.6">function deposit()</text>
    <text x="-28" y="12" font-family="monospace" font-size="5.5" fill="#a78bfa" opacity="0.5">  require(msg.val</text>
    <text x="-28" y="22" font-family="monospace" font-size="5.5" fill="#a78bfa" opacity="0.4">  balance += msg</text>
    <!-- Glow -->
    <circle cx="32" cy="-28" r="3" fill="#7c3aed" opacity="0.4"/>
    <text x="0" y="52" text-anchor="middle" font-family="monospace" font-size="7" fill="#7c3aed" opacity="0.5">SOLIDITY</text>
  </g>

  <!-- Connecting lines -->
  <line x1="180" y1="140" x2="250" y2="125" stroke="#f59e0b" stroke-width="0.8" opacity="0.15" stroke-dasharray="4,3"/>
  <line x1="390" y1="135" x2="470" y2="130" stroke="#7c3aed" stroke-width="0.8" opacity="0.15" stroke-dasharray="4,3"/>

  <!-- Title -->
  <text x="320" y="280" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" opacity="0.9">BLOCKCHAIN BASICS Part 2</text>
  <text x="320" y="300" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888" opacity="0.5">Keys, Transactions &amp; Smart Contracts</text>
  <!-- Top label -->
  <text x="320" y="38" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b" opacity="0.4">CRYPTOGRAPHY &amp; SMART CONTRACTS</text>
</svg>
