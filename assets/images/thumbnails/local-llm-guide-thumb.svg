<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="monitor-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Decorative orbs -->
  <circle cx="650" cy="100" r="130" fill="url(#glow1)"/>
  <circle cx="150" cy="350" r="110" fill="url(#glow2)"/>

  <!-- Terminal/Monitor (main motif) -->
  <g transform="translate(400,180)">
    <!-- Monitor body -->
    <rect x="-110" y="-80" width="220" height="150" rx="10" fill="url(#monitor-fill)" stroke="url(#accent)" stroke-width="2"/>
    <!-- Screen content: terminal lines -->
    <g font-family="monospace" font-size="11" opacity="0.8">
      <text x="-90" y="-50" fill="#10b981">$ ollama run llama3</text>
      <text x="-90" y="-30" fill="#6b6b80">pulling model...</text>
      <text x="-90" y="-10" fill="#6b6b80">running llama3:latest</text>
      <text x="-90" y="15" fill="#f97316">>>> Hello! How can I help?</text>
      <text x="-90" y="40" fill="#34d399">█</text>
    </g>
    <!-- Monitor stand -->
    <rect x="-20" y="72" width="40" height="8" rx="2" fill="#1e1e30"/>
    <rect x="-40" y="80" width="80" height="5" rx="2.5" fill="#1e1e30"/>
  </g>

  <!-- Ollama llama icon (stylized) -->
  <g transform="translate(600,160)" opacity="0.6">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="7" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#10b981">🦙</text>
  </g>

  <!-- Docker whale hint -->
  <g transform="translate(200,140)" opacity="0.4">
    <rect x="-18" y="-12" width="36" height="24" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.2"/>
    <g stroke="#00d4ff" stroke-width="1">
      <rect x="-12" y="-6" width="6" height="5" rx="1"/>
      <rect x="-4" y="-6" width="6" height="5" rx="1"/>
      <rect x="4" y="-6" width="6" height="5" rx="1"/>
      <rect x="-12" y="1" width="6" height="5" rx="1"/>
      <rect x="-4" y="1" width="6" height="5" rx="1"/>
    </g>
  </g>

  <!-- Floating particles -->
  <circle cx="250" cy="100" r="3" fill="#10b981" opacity="0.5"/>
  <circle cx="550" cy="320" r="2.5" fill="#f97316" opacity="0.4"/>
  <circle cx="680" cy="280" r="2" fill="#34d399" opacity="0.3"/>
  <circle cx="120" cy="200" r="3.5" fill="#10b981" opacity="0.35"/>
  <circle cx="700" cy="180" r="2" fill="#f97316" opacity="0.3"/>
  <circle cx="320" cy="320" r="2" fill="#10b981" opacity="0.4"/>

  <!-- Connection lines -->
  <line x1="250" y1="100" x2="310" y2="120" stroke="#10b981" stroke-width="0.5" opacity="0.15"/>
  <line x1="550" y1="320" x2="490" y2="290" stroke="#f97316" stroke-width="0.5" opacity="0.15"/>

  <!-- Title text -->
  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" opacity="0.92">Local LLM Guide</text>
  <text x="400" y="392" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a0a0b0" opacity="0.6">Ollama + Open WebUI</text>
</svg>
