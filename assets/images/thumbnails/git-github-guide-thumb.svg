<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05033"/>
      <stop offset="100%" stop-color="#f14e32"/>
    </linearGradient>
    <linearGradient id="gh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05033" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f05033" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Decorative orbs -->
  <circle cx="200" cy="120" r="130" fill="url(#glow1)"/>
  <circle cx="600" cy="300" r="120" fill="url(#glow2)"/>

  <!-- Git branch visualization (main motif) -->
  <g transform="translate(400,180)">
    <!-- Main branch line -->
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#f05033" stroke-width="2.5" opacity="0.7"/>
    <!-- Commits on main -->
    <circle cx="-120" cy="0" r="8" fill="#141425" stroke="#f05033" stroke-width="2"/>
    <circle cx="-40" cy="0" r="8" fill="#141425" stroke="#f05033" stroke-width="2"/>
    <circle cx="40" cy="0" r="8" fill="#141425" stroke="#f05033" stroke-width="2"/>
    <circle cx="120" cy="0" r="8" fill="#141425" stroke="#f05033" stroke-width="2"/>

    <!-- Feature branch -->
    <path d="M-40,0 C-20,-50 20,-50 80,-50" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7"/>
    <path d="M80,-50 C100,-50 100,-25 120,0" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.7" stroke-dasharray="4,3"/>
    <!-- Commits on feature branch -->
    <circle cx="10" cy="-48" r="6" fill="#141425" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="50" cy="-50" r="6" fill="#141425" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="80" cy="-50" r="6" fill="#141425" stroke="#8b5cf6" stroke-width="1.5"/>

    <!-- Labels -->
    <text x="-120" y="25" text-anchor="middle" font-family="monospace" font-size="9" fill="#f05033" opacity="0.7">main</text>
    <text x="50" y="-62" text-anchor="middle" font-family="monospace" font-size="9" fill="#8b5cf6" opacity="0.7">feature</text>
  </g>

  <!-- Git logo (simplified) -->
  <g transform="translate(240,140)" opacity="0.5">
    <rect x="-14" y="-14" width="28" height="28" rx="3" transform="rotate(45)" fill="none" stroke="#f05033" stroke-width="1.5"/>
  </g>

  <!-- GitHub Octocat hint (circle + tentacles) -->
  <g transform="translate(560,130)" opacity="0.4">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="-6" cy="-4" r="2.5" fill="#8b5cf6"/>
    <circle cx="6" cy="-4" r="2.5" fill="#8b5cf6"/>
    <path d="M-6,4 Q0,9 6,4" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
  </g>

  <!-- Floating particles -->
  <circle cx="150" cy="100" r="3" fill="#f05033" opacity="0.5"/>
  <circle cx="650" cy="320" r="2.5" fill="#8b5cf6" opacity="0.4"/>
  <circle cx="700" cy="150" r="2" fill="#a78bfa" opacity="0.3"/>
  <circle cx="100" cy="280" r="3.5" fill="#f05033" opacity="0.35"/>
  <circle cx="500" cy="100" r="2" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="320" cy="300" r="2" fill="#f05033" opacity="0.4"/>

  <!-- Connection lines -->
  <line x1="150" y1="100" x2="240" y2="140" stroke="#f05033" stroke-width="0.5" opacity="0.15"/>
  <line x1="650" y1="320" x2="560" y2="230" stroke="#8b5cf6" stroke-width="0.5" opacity="0.15"/>

  <!-- Title text -->
  <text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#ffffff" opacity="0.92">Git &amp; GitHub Guide</text>
  <text x="400" y="374" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a0a0b0" opacity="0.6">First Steps in Team Development</text>
</svg>
