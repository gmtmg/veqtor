<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080f"/>
      <stop offset="100%" stop-color="#0c0c1a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="440" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="110" x2="800" y2="110"/><line x1="0" y1="220" x2="800" y2="220"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
  </g>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" opacity="0.9">ポスト量子暗号 移行ロードマップ</text>
  <!-- Timeline axis -->
  <line x1="80" y1="80" x2="720" y2="80" stroke="#fff" stroke-width="1" opacity="0.15"/>
  <!-- Year markers -->
  <g font-family="monospace" font-size="10" fill="#888" opacity="0.5" text-anchor="middle">
    <text x="120" y="72">2024</text><line x1="120" y1="75" x2="120" y2="85" stroke="#888" stroke-width="0.5" opacity="0.3"/>
    <text x="240" y="72">2026</text><line x1="240" y1="75" x2="240" y2="85" stroke="#888" stroke-width="0.5" opacity="0.3"/>
    <text x="400" y="72">2030</text><line x1="400" y1="75" x2="400" y2="85" stroke="#888" stroke-width="0.5" opacity="0.3"/>
    <text x="560" y="72">2033</text><line x1="560" y1="75" x2="560" y2="85" stroke="#888" stroke-width="0.5" opacity="0.3"/>
    <text x="680" y="72">2035</text><line x1="680" y1="75" x2="680" y2="85" stroke="#888" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- NIST milestones -->
  <g>
    <circle cx="120" cy="80" r="4" fill="#7c3aed" opacity="0.8"/>
    <text x="120" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#7c3aed" opacity="0.6">NIST標準化</text>
    <circle cx="400" cy="80" r="4" fill="#f59e0b" opacity="0.8"/>
    <text x="400" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#f59e0b" opacity="0.6">RSA非推奨</text>
    <circle cx="680" cy="80" r="4" fill="#ff3c3c" opacity="0.8"/>
    <text x="680" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ff3c3c" opacity="0.6">RSA禁止</text>
  </g>
  <!-- NOW indicator -->
  <g transform="translate(240,80)">
    <line x1="0" y1="-20" x2="0" y2="5" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
    <polygon points="0,8 -4,0 4,0" fill="#00d4ff" opacity="0.6"/>
    <text x="0" y="-24" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#00d4ff" opacity="0.8">NOW</text>
  </g>
  <!-- ROW 1: Individual actions -->
  <g transform="translate(0,130)">
    <text x="80" y="0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981" opacity="0.8">個人</text>
    <!-- Step 1 -->
    <g transform="translate(160,0)">
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.5"/>
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="#10b981" opacity="0.04"/>
      <text x="0" y="-2" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10b981" opacity="0.8">Step 1</text>
      <text x="0" y="12" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">OS・アプリを</text>
      <text x="0" y="23" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">最新に更新</text>
    </g>
    <line x1="215" y1="5" x2="245" y2="5" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>
    <!-- Step 2 -->
    <g transform="translate(310,0)">
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.5"/>
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="#10b981" opacity="0.04"/>
      <text x="0" y="-2" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10b981" opacity="0.8">Step 2</text>
      <text x="0" y="12" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">PQC対応</text>
      <text x="0" y="23" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">ブラウザを使用</text>
    </g>
    <line x1="365" y1="5" x2="395" y2="5" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>
    <!-- Step 3 -->
    <g transform="translate(460,0)">
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.5"/>
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="#10b981" opacity="0.04"/>
      <text x="0" y="-2" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#10b981" opacity="0.8">Step 3</text>
      <text x="0" y="12" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">PQC対応の</text>
      <text x="0" y="23" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">メッセージアプリ</text>
    </g>
  </g>
  <!-- ROW 2: Enterprise actions -->
  <g transform="translate(0,240)">
    <text x="80" y="0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#00d4ff" opacity="0.8">企業</text>
    <!-- Phase 1 -->
    <g transform="translate(160,0)">
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.5"/>
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="#00d4ff" opacity="0.04"/>
      <text x="0" y="-2" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00d4ff" opacity="0.8">Phase 1</text>
      <text x="0" y="12" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">暗号棚卸し</text>
      <text x="0" y="23" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">現状把握</text>
    </g>
    <line x1="215" y1="5" x2="245" y2="5" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
    <!-- Phase 2 -->
    <g transform="translate(310,0)">
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.5"/>
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="#00d4ff" opacity="0.04"/>
      <text x="0" y="-2" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00d4ff" opacity="0.8">Phase 2</text>
      <text x="0" y="12" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">データ分類</text>
      <text x="0" y="23" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">優先度決定</text>
    </g>
    <line x1="365" y1="5" x2="395" y2="5" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
    <!-- Phase 3 -->
    <g transform="translate(460,0)">
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.5"/>
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="#00d4ff" opacity="0.04"/>
      <text x="0" y="-2" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00d4ff" opacity="0.8">Phase 3</text>
      <text x="0" y="12" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">ハイブリッド</text>
      <text x="0" y="23" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">暗号を導入</text>
    </g>
    <line x1="515" y1="5" x2="545" y2="5" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
    <!-- Phase 4 -->
    <g transform="translate(610,0)">
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.5"/>
      <rect x="-55" y="-18" width="110" height="46" rx="6" fill="#00d4ff" opacity="0.04"/>
      <text x="0" y="-2" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00d4ff" opacity="0.8">Phase 4</text>
      <text x="0" y="12" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">段階的に</text>
      <text x="0" y="23" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#aaa" opacity="0.6">完全移行</text>
    </g>
  </g>
  <!-- ROW 3: NIST deadlines -->
  <g transform="translate(0,340)">
    <text x="80" y="0" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f59e0b" opacity="0.8">NIST</text>
    <!-- 2030 deadline -->
    <g transform="translate(400,0)">
      <rect x="-70" y="-18" width="140" height="36" rx="6" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.4"/>
      <text x="0" y="-1" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f59e0b" opacity="0.7">2030: RSA-2048 非推奨</text>
      <text x="0" y="13" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#888" opacity="0.5">112ビット未満の暗号を非推奨に</text>
    </g>
    <!-- 2035 deadline -->
    <g transform="translate(640,0)">
      <rect x="-55" y="-18" width="110" height="36" rx="6" fill="none" stroke="#ff3c3c" stroke-width="1.2" opacity="0.4"/>
      <text x="0" y="-1" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ff3c3c" opacity="0.7">2035: RSA 禁止</text>
      <text x="0" y="13" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#888" opacity="0.5">従来暗号の使用を全面禁止</text>
    </g>
  </g>
  <!-- Bottom message -->
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#10b981" opacity="0.5">移行は段階的に ― 今日できることから始める</text>
</svg>
