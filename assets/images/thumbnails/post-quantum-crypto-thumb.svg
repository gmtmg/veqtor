<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <radialGradient id="glowL" cx="25%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#ff3c3c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glowR" cx="75%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="crackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ff3c3c"/>
    </linearGradient>
    <linearGradient id="latticeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <!-- Glows -->
  <rect width="640" height="360" fill="url(#glowL)"/>
  <rect width="640" height="360" fill="url(#glowR)"/>
  <!-- Divider arrow -->
  <path d="M310,80 L330,180 L310,280" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.15"/>
  <!-- LEFT: Crumbling key -->
  <g transform="translate(170,155)">
    <!-- Key body -->
    <rect x="-40" y="-8" width="60" height="16" rx="3" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
    <!-- Key head (circle) -->
    <circle cx="-50" cy="0" r="18" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
    <circle cx="-50" cy="0" r="6" fill="none" stroke="#ff6b6b" stroke-width="1.5" opacity="0.4"/>
    <!-- Key teeth -->
    <path d="M10,8 L10,18 M18,8 L18,15 M26,8 L26,20" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <!-- Cracks -->
    <line x1="-15" y1="-8" x2="-20" y2="-25" stroke="#ff3c3c" stroke-width="1.2" opacity="0.5"/>
    <line x1="-20" y1="-25" x2="-28" y2="-32" stroke="#ff3c3c" stroke-width="0.8" opacity="0.4"/>
    <line x1="-20" y1="-25" x2="-14" y2="-36" stroke="#ff3c3c" stroke-width="0.8" opacity="0.4"/>
    <line x1="5" y1="8" x2="8" y2="28" stroke="#ff3c3c" stroke-width="1.2" opacity="0.5"/>
    <line x1="8" y1="28" x2="2" y2="38" stroke="#ff3c3c" stroke-width="0.8" opacity="0.4"/>
    <line x1="8" y1="28" x2="16" y2="35" stroke="#ff3c3c" stroke-width="0.8" opacity="0.4"/>
    <!-- Falling fragments -->
    <rect x="-35" y="30" width="6" height="4" rx="1" fill="#ff6b6b" opacity="0.3" transform="rotate(25,-32,32)"/>
    <rect x="30" y="-30" width="5" height="3" rx="1" fill="#ff6b6b" opacity="0.25" transform="rotate(-15,32,-28)"/>
    <rect x="-55" y="-35" width="4" height="3" rx="1" fill="#ff6b6b" opacity="0.2" transform="rotate(40,-53,-33)"/>
    <!-- Danger circle -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ff3c3c" stroke-width="0.5" opacity="0.15" stroke-dasharray="4,6"/>
  </g>
  <text x="170" y="235" text-anchor="middle" font-family="monospace" font-size="8" fill="#ff6b6b" opacity="0.5">RSA / ECC</text>
  <text x="170" y="248" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff3c3c" opacity="0.4">VULNERABLE</text>
  <!-- RIGHT: Lattice structure -->
  <g transform="translate(470,155)">
    <!-- 3D lattice grid -->
    <g stroke="url(#latticeGrad)" fill="none" opacity="0.6">
      <!-- Front face -->
      <line x1="-35" y1="-35" x2="35" y2="-35" stroke-width="1.5"/>
      <line x1="35" y1="-35" x2="35" y2="35" stroke-width="1.5"/>
      <line x1="35" y1="35" x2="-35" y2="35" stroke-width="1.5"/>
      <line x1="-35" y1="35" x2="-35" y2="-35" stroke-width="1.5"/>
      <!-- Cross lines -->
      <line x1="0" y1="-35" x2="0" y2="35" stroke-width="0.8"/>
      <line x1="-35" y1="0" x2="35" y2="0" stroke-width="0.8"/>
      <!-- Back face (offset) -->
      <line x1="-20" y1="-50" x2="50" y2="-50" stroke-width="0.8" opacity="0.4"/>
      <line x1="50" y1="-50" x2="50" y2="20" stroke-width="0.8" opacity="0.4"/>
      <line x1="50" y1="20" x2="-20" y2="20" stroke-width="0.8" opacity="0.4"/>
      <line x1="-20" y1="20" x2="-20" y2="-50" stroke-width="0.8" opacity="0.4"/>
      <!-- Depth connectors -->
      <line x1="-35" y1="-35" x2="-20" y2="-50" stroke-width="0.8" opacity="0.3"/>
      <line x1="35" y1="-35" x2="50" y2="-50" stroke-width="0.8" opacity="0.3"/>
      <line x1="35" y1="35" x2="50" y2="20" stroke-width="0.8" opacity="0.3"/>
      <line x1="-35" y1="35" x2="-20" y2="20" stroke-width="0.8" opacity="0.3"/>
    </g>
    <!-- Lattice nodes -->
    <g fill="#00d4ff">
      <circle cx="-35" cy="-35" r="3" opacity="0.8"/><circle cx="0" cy="-35" r="2.5" opacity="0.6"/>
      <circle cx="35" cy="-35" r="3" opacity="0.8"/><circle cx="-35" cy="0" r="2.5" opacity="0.6"/>
      <circle cx="0" cy="0" r="4" opacity="0.9"/><circle cx="35" cy="0" r="2.5" opacity="0.6"/>
      <circle cx="-35" cy="35" r="3" opacity="0.8"/><circle cx="0" cy="35" r="2.5" opacity="0.6"/>
      <circle cx="35" cy="35" r="3" opacity="0.8"/>
    </g>
    <!-- Back face nodes -->
    <g fill="#7c3aed" opacity="0.5">
      <circle cx="-20" cy="-50" r="2"/><circle cx="50" cy="-50" r="2"/>
      <circle cx="50" cy="20" r="2"/><circle cx="-20" cy="20" r="2"/>
    </g>
    <!-- Shield outline -->
    <path d="M0,-58 L40,-42 L40,10 L0,35 L-40,10 L-40,-42 Z" fill="none" stroke="#00d4ff" stroke-width="0.6" opacity="0.2"/>
  </g>
  <text x="470" y="235" text-anchor="middle" font-family="monospace" font-size="8" fill="#00d4ff" opacity="0.5">ML-KEM / ML-DSA</text>
  <text x="470" y="248" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" opacity="0.4">QUANTUM-SAFE</text>
  <!-- Center transition arrow -->
  <g opacity="0.4">
    <line x1="280" y1="155" x2="350" y2="155" stroke="#fff" stroke-width="1.5"/>
    <polygon points="350,155 342,150 342,160" fill="#fff"/>
  </g>
  <!-- Title -->
  <text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" opacity="0.9">POST-QUANTUM CRYPTOGRAPHY</text>
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888" opacity="0.5">Preparing for Q-Day</text>
  <!-- Top label -->
  <text x="320" y="38" text-anchor="middle" font-family="monospace" font-size="7" fill="#7c3aed" opacity="0.4">NIST STANDARDIZED 2024</text>
</svg>
