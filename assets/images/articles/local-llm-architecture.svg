<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#10101e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <rect width="760" height="400" rx="12" fill="url(#hbg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="760" y2="100"/><line x1="0" y1="200" x2="760" y2="200"/>
    <line x1="0" y1="300" x2="760" y2="300"/>
    <line x1="190" y1="0" x2="190" y2="400"/><line x1="380" y1="0" x2="380" y2="400"/>
    <line x1="570" y1="0" x2="570" y2="400"/>
  </g>

  <!-- Title -->
  <text x="380" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981" opacity="0.9" letter-spacing="0.1em">CLOUD LLM vs LOCAL LLM</text>

  <!-- ===== Left: Cloud LLM ===== -->
  <text x="190" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#f97316" opacity="0.8">Cloud LLM（従来型）</text>

  <!-- User device -->
  <g transform="translate(100,130)">
    <rect x="-45" y="-22" width="90" height="44" rx="6" fill="#141425" stroke="#f97316" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f97316" opacity="0.8">PC / スマホ</text>
  </g>

  <!-- Arrow: to internet -->
  <g transform="translate(155,130)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#f97316" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
    <polygon points="45,-3 51,0 45,3" fill="#f97316" opacity="0.6"/>
  </g>

  <!-- Internet cloud -->
  <g transform="translate(240,130)">
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="none" stroke="#6b6b80" stroke-width="1" opacity="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6b6b80" opacity="0.7">Internet</text>
  </g>

  <!-- Arrow: to cloud server -->
  <g transform="translate(280,130)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#f97316" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6"/>
    <polygon points="30,-3 36,0 30,3" fill="#f97316" opacity="0.6"/>
  </g>

  <!-- Cloud API server -->
  <g transform="translate(350,105)">
    <rect x="-35" y="-18" width="70" height="50" rx="6" fill="#141425" stroke="#f97316" stroke-width="1.2"/>
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f97316" opacity="0.8">OpenAI</text>
    <text x="0" y="14" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f97316" opacity="0.8">API</text>
  </g>

  <!-- Cloud issues -->
  <g transform="translate(190,195)" font-family="sans-serif" font-size="9.5" fill="#a0a0b0" opacity="0.7">
    <text x="-80" y="0">✗ データがクラウドに送信される</text>
    <text x="-80" y="18">✗ API料金が発生する</text>
    <text x="-80" y="36">✗ オフラインでは使えない</text>
    <text x="-80" y="54">✗ レート制限がある</text>
  </g>

  <!-- Divider -->
  <line x1="380" y1="75" x2="380" y2="370" stroke="#1e1e30" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ===== Right: Local LLM ===== -->
  <text x="570" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#10b981" opacity="0.8">Local LLM（Ollama）</text>

  <!-- User device (local) -->
  <g transform="translate(480,130)">
    <rect x="-45" y="-22" width="90" height="44" rx="6" fill="#141425" stroke="#10b981" stroke-width="1.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#10b981" opacity="0.8">PC / スマホ</text>
  </g>

  <!-- Arrow: local connection -->
  <g transform="translate(535,130)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <polygon points="40,-3 46,0 40,3" fill="#10b981" opacity="0.7"/>
    <text x="20" y="-10" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#34d399" opacity="0.6">localhost</text>
  </g>

  <!-- Ollama server -->
  <g transform="translate(625,105)">
    <rect x="-40" y="-18" width="80" height="50" rx="6" fill="#141425" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="-2" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="600" fill="#10b981" opacity="0.9">Ollama</text>
    <text x="0" y="12" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#34d399" opacity="0.7">LLM Engine</text>
  </g>

  <!-- GPU chip -->
  <g transform="translate(625,172)">
    <rect x="-25" y="-10" width="50" height="20" rx="4" fill="#141425" stroke="#34d399" stroke-width="1" opacity="0.6"/>
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="8" fill="#34d399" opacity="0.7">GPU/CPU</text>
  </g>

  <!-- Local advantages -->
  <g transform="translate(570,210)" font-family="sans-serif" font-size="9.5" fill="#a0a0b0" opacity="0.7">
    <text x="-80" y="0" fill="#34d399">✓ データは手元から出ない</text>
    <text x="-80" y="18" fill="#34d399">✓ 完全無料で使い放題</text>
    <text x="-80" y="36" fill="#34d399">✓ オフラインでも動作</text>
    <text x="-80" y="54" fill="#34d399">✓ カスタマイズ自由</text>
  </g>

  <!-- Bottom summary -->
  <g transform="translate(380,365)">
    <rect x="-200" y="-16" width="400" height="32" rx="16" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399" opacity="0.9">ローカルLLM = プライバシー + コスト削減 + 自由度</text>
  </g>
</svg>
