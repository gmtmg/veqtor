<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#10101e"/>
    </linearGradient>
  </defs>

  <rect width="760" height="380" rx="12" fill="url(#rbg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="76" x2="760" y2="76"/><line x1="0" y1="152" x2="760" y2="152"/>
    <line x1="0" y1="228" x2="760" y2="228"/><line x1="0" y1="304" x2="760" y2="304"/>
    <line x1="152" y1="0" x2="152" y2="380"/><line x1="304" y1="0" x2="304" y2="380"/>
    <line x1="456" y1="0" x2="456" y2="380"/><line x1="608" y1="0" x2="608" y2="380"/>
  </g>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ff3cac" opacity="0.9" letter-spacing="0.1em">AI CYBER RISK LANDSCAPE 2026</text>

  <!-- Central hub -->
  <circle cx="380" cy="195" r="40" fill="none" stroke="#ff3cac" stroke-width="1.5" opacity="0.3"/>
  <circle cx="380" cy="195" r="28" fill="#ff3cac" opacity="0.04"/>
  <text x="380" y="192" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ff3cac" opacity="0.8">AI Cyber</text>
  <text x="380" y="205" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ff3cac" opacity="0.6">Risk</text>

  <!-- Risk node 1: Capability Proliferation -->
  <g>
    <circle cx="140" cy="100" r="30" fill="none" stroke="#ef4444" stroke-width="1.2" opacity="0.5"/>
    <circle cx="140" cy="100" r="20" fill="#ef4444" opacity="0.05"/>
    <text x="140" y="97" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#ef4444" opacity="0.9">能力拡散</text>
    <text x="140" y="109" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#ef4444" opacity="0.6">Proliferation</text>
    <line x1="170" y1="115" x2="345" y2="178" stroke="#ef4444" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Risk node 2: Legacy Infrastructure -->
  <g>
    <circle cx="620" cy="100" r="30" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.5"/>
    <circle cx="620" cy="100" r="20" fill="#f59e0b" opacity="0.05"/>
    <text x="620" y="97" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#f59e0b" opacity="0.9">レガシー</text>
    <text x="620" y="109" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#f59e0b" opacity="0.6">Infrastructure</text>
    <line x1="590" y1="115" x2="415" y2="178" stroke="#f59e0b" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Risk node 3: Autonomous Action -->
  <g>
    <circle cx="140" cy="290" r="30" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.5"/>
    <circle cx="140" cy="290" r="20" fill="#a855f7" opacity="0.05"/>
    <text x="140" y="287" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#a855f7" opacity="0.9">自律行動</text>
    <text x="140" y="299" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#a855f7" opacity="0.6">Autonomous</text>
    <line x1="170" y1="275" x2="345" y2="212" stroke="#a855f7" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Risk node 4: Arms Race -->
  <g>
    <circle cx="620" cy="290" r="30" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.5"/>
    <circle cx="620" cy="290" r="20" fill="#06b6d4" opacity="0.05"/>
    <text x="620" y="287" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#06b6d4" opacity="0.9">軍拡競争</text>
    <text x="620" y="299" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#06b6d4" opacity="0.6">Arms Race</text>
    <line x1="590" y1="275" x2="415" y2="212" stroke="#06b6d4" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Risk node 5: Attacker Asymmetry (top center) -->
  <g>
    <circle cx="380" cy="75" r="28" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.5"/>
    <circle cx="380" cy="75" r="18" fill="#10b981" opacity="0.05"/>
    <text x="380" y="72" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#10b981" opacity="0.9">攻撃非対称</text>
    <text x="380" y="84" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#10b981" opacity="0.6">Asymmetry</text>
    <line x1="380" y1="103" x2="380" y2="155" stroke="#10b981" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Risk node 6: Governance Gap (bottom center) -->
  <g>
    <circle cx="380" cy="315" r="28" fill="none" stroke="#ec4899" stroke-width="1.2" opacity="0.5"/>
    <circle cx="380" cy="315" r="18" fill="#ec4899" opacity="0.05"/>
    <text x="380" y="312" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" fill="#ec4899" opacity="0.9">規制ギャップ</text>
    <text x="380" y="324" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#ec4899" opacity="0.6">Governance</text>
    <line x1="380" y1="287" x2="380" y2="235" stroke="#ec4899" stroke-width="0.8" opacity="0.2"/>
  </g>

  <!-- Bottom note -->
  <text x="380" y="365" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b6b80" opacity="0.5">CFR分析に基づく6つのリスク領域 ― 技術進化と規制のギャップが拡大</text>
</svg>
