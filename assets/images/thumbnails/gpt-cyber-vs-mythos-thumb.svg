<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0e0e18"/>
    </linearGradient>
    <linearGradient id="glow-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glow-amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <!-- Central VS divider -->
  <line x1="320" y1="40" x2="320" y2="260" stroke="#ff3cac" stroke-width="1.5" opacity="0.2"/>
  <!-- OpenAI shield (left) -->
  <g transform="translate(170,130)">
    <polygon points="0,-50 45,-25 45,25 0,50 -45,25 -45,-25" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
    <polygon points="0,-35 32,-18 32,18 0,35 -32,18 -32,-18" fill="#10b981" opacity="0.06"/>
    <text x="0" y="-5" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981" opacity="0.9">GPT-5.4</text>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="10" fill="#10b981" opacity="0.7">Cyber</text>
    <!-- Radiating scan lines -->
    <line x1="-60" y1="-10" x2="-48" y2="-10" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <line x1="-60" y1="0" x2="-48" y2="0" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <line x1="-60" y1="10" x2="-48" y2="10" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Anthropic shield (right) -->
  <g transform="translate(470,130)">
    <polygon points="0,-50 45,-25 45,25 0,50 -45,25 -45,-25" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
    <polygon points="0,-35 32,-18 32,18 0,35 -32,18 -32,-18" fill="#f59e0b" opacity="0.06"/>
    <text x="0" y="-5" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#f59e0b" opacity="0.9">Claude</text>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="10" fill="#f59e0b" opacity="0.7">Mythos</text>
    <!-- Lock symbol lines -->
    <line x1="48" y1="-10" x2="60" y2="-10" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
    <line x1="48" y1="0" x2="60" y2="0" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
    <line x1="48" y1="10" x2="60" y2="10" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- Clash energy at center -->
  <g opacity="0.4">
    <line x1="230" y1="110" x2="290" y2="130" stroke="#10b981" stroke-width="1"/>
    <line x1="230" y1="130" x2="290" y2="130" stroke="#10b981" stroke-width="0.8"/>
    <line x1="230" y1="150" x2="290" y2="130" stroke="#10b981" stroke-width="1"/>
    <line x1="410" y1="110" x2="350" y2="130" stroke="#f59e0b" stroke-width="1"/>
    <line x1="410" y1="130" x2="350" y2="130" stroke="#f59e0b" stroke-width="0.8"/>
    <line x1="410" y1="150" x2="350" y2="130" stroke="#f59e0b" stroke-width="1"/>
  </g>
  <!-- VS text -->
  <text x="320" y="137" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ff3cac" opacity="0.8">VS</text>
  <!-- Sparkle dots -->
  <circle cx="290" cy="130" r="3" fill="#10b981" opacity="0.5"/>
  <circle cx="350" cy="130" r="3" fill="#f59e0b" opacity="0.5"/>
  <circle cx="320" cy="130" r="2" fill="#ff3cac" opacity="0.6"/>
  <!-- Category badge -->
  <rect x="272" y="42" width="96" height="22" rx="11" fill="#ff3cac" opacity="0.12"/>
  <text x="320" y="57" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#ff3cac" opacity="0.8">AI SECURITY</text>
  <!-- Philosophy labels -->
  <text x="170" y="210" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#10b981" opacity="0.5">"Broad but Verified"</text>
  <text x="470" y="210" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f59e0b" opacity="0.5">"Narrow and Controlled"</text>
  <!-- Title text -->
  <text x="320" y="290" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" opacity="0.9">AI CYBERSECURITY DIVERGENCE</text>
  <text x="320" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888" opacity="0.6">GPT-5.4 Cyber vs Claude Mythos ― 2 Philosophies</text>
</svg>
