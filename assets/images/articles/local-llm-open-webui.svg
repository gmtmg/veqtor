<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#10101e"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="760" height="400" rx="12" fill="url(#hbg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="760" y2="100"/><line x1="0" y1="200" x2="760" y2="200"/>
    <line x1="0" y1="300" x2="760" y2="300"/>
    <line x1="190" y1="0" x2="190" y2="400"/><line x1="380" y1="0" x2="380" y2="400"/>
    <line x1="570" y1="0" x2="570" y2="400"/>
  </g>

  <!-- Title -->
  <text x="380" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981" opacity="0.9" letter-spacing="0.1em">OPEN WEBUI + OLLAMA ARCHITECTURE</text>

  <!-- Flow description -->
  <text x="380" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0a0b0" opacity="0.6">ブラウザからローカルLLMを操作する構成</text>

  <!-- ===== Layer 1: Browser ===== -->
  <g transform="translate(130,140)">
    <rect x="-75" y="-40" width="150" height="80" rx="8" fill="#141425" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Browser chrome -->
    <rect x="-65" y="-32" width="130" height="16" rx="3" fill="#1a1a2e"/>
    <circle cx="-55" cy="-24" r="3" fill="#ef4444" opacity="0.5"/>
    <circle cx="-45" cy="-24" r="3" fill="#f59e0b" opacity="0.5"/>
    <circle cx="-35" cy="-24" r="3" fill="#10b981" opacity="0.5"/>
    <!-- URL bar -->
    <rect x="-25" y="-28" width="80" height="8" rx="2" fill="#0a0a14"/>
    <text x="15" y="-22" text-anchor="middle" font-family="monospace" font-size="6" fill="#6b6b80">localhost:3000</text>
    <!-- Chat UI hint -->
    <rect x="-60" y="-10" width="120" height="40" rx="3" fill="#0a0a14"/>
    <rect x="-52" y="-4" width="70" height="8" rx="2" fill="#1e1e30"/>
    <rect x="-52" y="8" width="50" height="8" rx="2" fill="#1e1e30"/>
    <rect x="-52" y="20" width="90" height="8" rx="2" fill="#10b981" opacity="0.15"/>
    <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity="0.85">ブラウザ</text>
    <text x="0" y="66" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3b82f6" opacity="0.7">ChatGPT風のUI</text>
  </g>

  <!-- Arrow 1: Browser → Open WebUI -->
  <g transform="translate(225,140)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#3b82f6" stroke-width="1.5" opacity="0.6"/>
    <polygon points="70,-4 78,0 70,4" fill="#3b82f6" opacity="0.7"/>
    <text x="35" y="-12" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a0a0b0" opacity="0.6">HTTP</text>
    <text x="35" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="#6b6b80" opacity="0.5">:3000</text>
  </g>

  <!-- ===== Layer 2: Open WebUI (Docker) ===== -->
  <g transform="translate(380,140)">
    <rect x="-70" y="-45" width="140" height="90" rx="8" fill="#141425" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Docker whale hint -->
    <g transform="translate(45,-32)" opacity="0.5">
      <rect x="-8" y="-5" width="16" height="10" rx="3" fill="none" stroke="#00d4ff" stroke-width="0.8"/>
      <rect x="-5" y="-2" width="3" height="3" rx="0.5" fill="#00d4ff" opacity="0.6"/>
      <rect x="0" y="-2" width="3" height="3" rx="0.5" fill="#00d4ff" opacity="0.6"/>
    </g>
    <text x="0" y="-10" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#3b82f6" opacity="0.9">Open WebUI</text>
    <text x="0" y="8" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a0a0b0" opacity="0.6">Docker Container</text>
    <!-- Features -->
    <text x="0" y="26" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#60a5fa" opacity="0.6">チャット管理・履歴・設定</text>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity="0.85">WebUIサーバー</text>
    <text x="0" y="72" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#3b82f6" opacity="0.7">フロントエンド + API中継</text>
  </g>

  <!-- Arrow 2: Open WebUI → Ollama -->
  <g transform="translate(470,140)">
    <line x1="0" y1="0" x2="70" y2="0" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
    <polygon points="70,-4 78,0 70,4" fill="#10b981" opacity="0.7"/>
    <text x="35" y="-12" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a0a0b0" opacity="0.6">REST API</text>
    <text x="35" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="#6b6b80" opacity="0.5">:11434</text>
  </g>

  <!-- ===== Layer 3: Ollama ===== -->
  <g transform="translate(625,140)">
    <rect x="-65" y="-45" width="130" height="90" rx="8" fill="#141425" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="-12" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#10b981" opacity="0.9">Ollama</text>
    <text x="0" y="6" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a0a0b0" opacity="0.6">LLM Runtime</text>
    <text x="0" y="24" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#34d399" opacity="0.6">モデル管理・推論実行</text>
    <text x="0" y="58" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff" opacity="0.85">推論エンジン</text>
    <text x="0" y="72" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#10b981" opacity="0.7">llama.cpp ベース</text>
  </g>

  <!-- ===== Layer 4: Models (below Ollama) ===== -->
  <g transform="translate(625,265)">
    <rect x="-80" y="-25" width="160" height="70" rx="8" fill="#141425" stroke="#34d399" stroke-width="1" opacity="0.7"/>
    <text x="0" y="-8" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#34d399" opacity="0.8">Models</text>
    <!-- Model chips -->
    <g font-family="monospace" font-size="8" opacity="0.7">
      <rect x="-68" y="2" width="52" height="14" rx="3" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="0.5"/>
      <text x="-42" y="12" text-anchor="middle" fill="#34d399">llama3</text>
      <rect x="-10" y="2" width="52" height="14" rx="3" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="0.5"/>
      <text x="16" y="12" text-anchor="middle" fill="#34d399">gemma2</text>
      <rect x="-68" y="20" width="52" height="14" rx="3" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="0.5"/>
      <text x="-42" y="30" text-anchor="middle" fill="#34d399">phi3</text>
      <rect x="-10" y="20" width="52" height="14" rx="3" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="0.5"/>
      <text x="16" y="30" text-anchor="middle" fill="#34d399">mistral</text>
    </g>
  </g>

  <!-- Arrow: Ollama → Models -->
  <g transform="translate(625,205)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.5"/>
    <polygon points="-3,30 0,36 3,30" fill="#34d399" opacity="0.5"/>
  </g>

  <!-- Bottom: All on your machine -->
  <g transform="translate(380,372)">
    <rect x="-220" y="-16" width="440" height="32" rx="16" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399" opacity="0.9">すべてローカルマシン上で完結 — インターネット接続不要</text>
  </g>
</svg>
