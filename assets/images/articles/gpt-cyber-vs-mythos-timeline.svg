<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#10101e"/>
    </linearGradient>
  </defs>

  <rect width="760" height="320" rx="12" fill="url(#tbg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="80" x2="760" y2="80"/><line x1="0" y1="160" x2="760" y2="160"/>
    <line x1="0" y1="240" x2="760" y2="240"/>
    <line x1="152" y1="0" x2="152" y2="320"/><line x1="304" y1="0" x2="304" y2="320"/>
    <line x1="456" y1="0" x2="456" y2="320"/><line x1="608" y1="0" x2="608" y2="320"/>
  </g>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ff3cac" opacity="0.9" letter-spacing="0.1em">AI CYBERSECURITY TIMELINE — APR 2026</text>

  <!-- Timeline axis -->
  <line x1="60" y1="165" x2="700" y2="165" stroke="#2a2a40" stroke-width="2"/>

  <!-- Week labels -->
  <text x="130" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#6b6b80">3月上旬</text>
  <text x="280" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#ff3cac" opacity="0.8">3月下旬</text>
  <text x="430" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#ff3cac" opacity="0.8">4月上旬</text>
  <text x="580" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#ff3cac" opacity="0.8">4月中旬</text>

  <!-- Week dividers -->
  <line x1="200" y1="155" x2="200" y2="175" stroke="#2a2a40" stroke-width="1.5"/>
  <line x1="350" y1="155" x2="350" y2="175" stroke="#2a2a40" stroke-width="1.5"/>
  <line x1="500" y1="155" x2="500" y2="175" stroke="#2a2a40" stroke-width="1.5"/>
  <line x1="650" y1="155" x2="650" y2="175" stroke="#2a2a40" stroke-width="1.5"/>

  <!-- Hot zone -->
  <rect x="220" y="155" width="410" height="20" rx="4" fill="#ff3cac" opacity="0.06"/>

  <!-- Event 1: GPT-5.4 release (Mar 5) -->
  <g>
    <circle cx="130" cy="165" r="5" fill="#10b981"/>
    <line x1="130" y1="160" x2="130" y2="105" stroke="#10b981" stroke-width="1" opacity="0.4"/>
    <text x="130" y="98" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#10b981">GPT-5.4 リリース</text>
    <text x="130" y="84" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b6b80">3/5</text>
  </g>

  <!-- Event 2: Mythos leak -->
  <g>
    <circle cx="260" cy="165" r="5" fill="#f59e0b"/>
    <line x1="260" y1="170" x2="260" y2="220" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="260" y="232" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#f59e0b">Mythos リーク</text>
    <text x="260" y="246" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b6b80">3月下旬</text>
  </g>

  <!-- Event 3: Mythos official -->
  <g>
    <circle cx="380" cy="165" r="6" fill="#f59e0b"/>
    <line x1="380" y1="160" x2="380" y2="90" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="380" y="82" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#f59e0b">Mythos Preview 正式発表</text>
    <text x="380" y="68" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b6b80">4/2</text>
  </g>

  <!-- Event 4: GPT-5.4 Cyber -->
  <g>
    <circle cx="490" cy="165" r="6" fill="#10b981"/>
    <line x1="490" y1="170" x2="490" y2="220" stroke="#10b981" stroke-width="1" opacity="0.4"/>
    <text x="490" y="232" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#10b981">GPT-5.4 Cyber 公開</text>
    <text x="490" y="246" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b6b80">4/8</text>
  </g>

  <!-- Event 5: Opus 4.7 -->
  <g>
    <circle cx="610" cy="165" r="5" fill="#a855f7"/>
    <line x1="610" y1="160" x2="610" y2="105" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
    <text x="610" y="98" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#a855f7">Opus 4.7 発表</text>
    <text x="610" y="84" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b6b80">4/15</text>
  </g>

  <!-- Legend -->
  <g transform="translate(180,280)">
    <circle cx="0" cy="0" r="4" fill="#10b981"/><text x="10" y="4" font-family="sans-serif" font-size="9" fill="#6b6b80">OpenAI</text>
    <circle cx="80" cy="0" r="4" fill="#f59e0b"/><text x="90" y="4" font-family="sans-serif" font-size="9" fill="#6b6b80">Anthropic</text>
    <circle cx="180" cy="0" r="4" fill="#a855f7"/><text x="190" y="4" font-family="sans-serif" font-size="9" fill="#6b6b80">Anthropic (Opus)</text>
  </g>

  <!-- Bottom note -->
  <text x="380" y="305" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b6b80" opacity="0.5">わずか6週間でAIサイバーセキュリティの勢力図が激変</text>
</svg>
