<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <rect width="640" height="360" fill="url(#glow)"/>
  <!-- Top label -->
  <text x="320" y="38" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" opacity="0.5">LEARNING ROADMAP</text>
  <!-- Book shape -->
  <g transform="translate(320,175)">
    <rect x="-90" y="-70" width="180" height="140" rx="4" fill="#0e0e18" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
    <rect x="-90" y="-70" width="16" height="140" rx="4" fill="#10b981" opacity="0.3"/>
    <line x1="-74" y1="-70" x2="-74" y2="70" stroke="#10b981" stroke-width="0.5" opacity="0.5"/>
    <line x1="88" y1="-60" x2="88" y2="60" stroke="#fff" stroke-width="0.5" opacity="0.1"/>
    <line x1="86" y1="-60" x2="86" y2="60" stroke="#fff" stroke-width="0.5" opacity="0.06"/>
    <!-- Cover content -->
    <text x="10" y="-30" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" opacity="0.9">セキュリティ</text>
    <text x="10" y="-14" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" opacity="0.9">入門コース</text>
    <!-- Shield icon -->
    <g transform="translate(10,20)" opacity="0.7">
      <path d="M0,-12 L12,-6 L12,4 C12,10 0,16 0,16 C0,16 -12,10 -12,4 L-12,-6 Z" fill="none" stroke="#10b981" stroke-width="1.2"/>
      <path d="M-4,2 L-1,5 L5,-2" fill="none" stroke="#6ee7b7" stroke-width="1.2" stroke-linecap="round"/>
    </g>
    <text x="10" y="52" text-anchor="middle" font-family="monospace" font-size="8" fill="#10b981" opacity="0.6">3 LESSONS</text>
  </g>
  <!-- Bottom title -->
  <text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" opacity="0.85">SECURITY COURSE</text>
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#10b981" opacity="0.5">Passkeys, Zero Trust &amp; Post-Quantum</text>
</svg>
