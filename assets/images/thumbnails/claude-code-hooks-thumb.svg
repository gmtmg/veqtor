<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ff3cac"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.06">
    <line x1="0" y1="75" x2="800" y2="75" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="225" x2="800" y2="225" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="375" x2="800" y2="375" stroke="#fff" stroke-width="0.5"/>
    <line x1="133" y1="0" x2="133" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="266" y1="0" x2="266" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="533" y1="0" x2="533" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="666" y1="0" x2="666" y2="450" stroke="#fff" stroke-width="0.5"/>
  </g>
  <!-- Orbs -->
  <circle cx="200" cy="120" r="150" fill="url(#glow1)" opacity="0.6"/>
  <circle cx="620" cy="330" r="120" fill="#7c3aed" opacity="0.07"/>
  <!-- Hook lifecycle: PreToolUse → Tool → PostToolUse -->
  <g transform="translate(130, 100)">
    <!-- PreToolUse -->
    <rect width="140" height="60" rx="8" fill="#0e0e18" stroke="#00d4ff" stroke-width="1.5"/>
    <text x="70" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#00d4ff">PreToolUse</text>
    <text x="70" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6b6b80">ブロック / 許可</text>
    <!-- Arrow -->
    <line x1="145" y1="30" x2="185" y2="30" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <polygon points="183,25 193,30 183,35" fill="#00d4ff" opacity="0.5"/>
  </g>
  <g transform="translate(330, 100)">
    <!-- Tool execution -->
    <rect width="140" height="60" rx="8" fill="#0e0e18" stroke="url(#accent)" stroke-width="1.5"/>
    <text x="70" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#ffffff">Tool 実行</text>
    <text x="70" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6b6b80">Bash / Write...</text>
    <!-- Arrow -->
    <line x1="145" y1="30" x2="185" y2="30" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>
    <polygon points="183,25 193,30 183,35" fill="#7c3aed" opacity="0.5"/>
  </g>
  <g transform="translate(530, 100)">
    <!-- PostToolUse -->
    <rect width="140" height="60" rx="8" fill="#0e0e18" stroke="#ff3cac" stroke-width="1.5"/>
    <text x="70" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#ff3cac">PostToolUse</text>
    <text x="70" y="46" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6b6b80">整形 / ログ</text>
  </g>
  <!-- Hook script block -->
  <g transform="translate(220, 195)">
    <rect width="360" height="110" rx="8" fill="#0e0e18" stroke="#1e1e30" stroke-width="1.5"/>
    <text x="16" y="28" font-family="JetBrains Mono, monospace" font-size="12" fill="#6b6b80">#!/bin/bash</text>
    <text x="16" y="48" font-family="JetBrains Mono, monospace" font-size="12" fill="#00d4ff">if</text>
    <text x="40" y="48" font-family="JetBrains Mono, monospace" font-size="12" fill="#ffffff"> [[ "$CMD" =~ rm ]]; </text>
    <text x="250" y="48" font-family="JetBrains Mono, monospace" font-size="12" fill="#00d4ff">then</text>
    <text x="16" y="68" font-family="JetBrains Mono, monospace" font-size="12" fill="#ffffff">  </text>
    <text x="28" y="68" font-family="JetBrains Mono, monospace" font-size="12" fill="#ff3cac">exit 2</text>
    <text x="88" y="68" font-family="JetBrains Mono, monospace" font-size="12" fill="#6b6b80">  # Block!</text>
    <text x="16" y="88" font-family="JetBrains Mono, monospace" font-size="12" fill="#00d4ff">fi</text>
    <!-- Blinking cursor -->
    <rect x="32" y="92" width="6" height="14" fill="#00d4ff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- Title -->
  <text x="400" y="365" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Claude Code Hooks</text>
  <text x="400" y="395" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#6b6b80">Deterministic guardrails for AI agents</text>
</svg>
