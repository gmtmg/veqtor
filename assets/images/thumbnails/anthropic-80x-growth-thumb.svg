<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0e0e18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <rect width="640" height="360" fill="url(#glow)"/>
  <!-- Top label -->
  <text x="320" y="32" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b" opacity="0.5">BREAKING NEWS</text>
  <!-- Growth chart -->
  <g transform="translate(80,80)">
    <!-- Axes -->
    <line x1="40" y1="160" x2="460" y2="160" stroke="#fff" stroke-width="0.5" opacity="0.2"/>
    <line x1="40" y1="160" x2="40" y2="20" stroke="#fff" stroke-width="0.5" opacity="0.2"/>
    <!-- Revenue curve (exponential) -->
    <path d="M60,155 Q120,152 180,145 Q240,130 300,100 Q360,50 420,25" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Data points -->
    <circle cx="60" cy="155" r="3" fill="#d97706" opacity="0.8"/>
    <circle cx="180" cy="145" r="3" fill="#f59e0b" opacity="0.8"/>
    <circle cx="300" cy="100" r="3.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="420" cy="25" r="4.5" fill="#fbbf24"/>
    <!-- Labels -->
    <text x="60" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#888" opacity="0.6">'24</text>
    <text x="180" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#888" opacity="0.6">'25 Q1</text>
    <text x="300" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#888" opacity="0.6">'25 Q4</text>
    <text x="420" y="172" text-anchor="middle" font-family="monospace" font-size="7" fill="#888" opacity="0.6">'26 Q1</text>
    <!-- Value labels -->
    <text x="60" y="148" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b" opacity="0.7">$87M</text>
    <text x="300" y="93" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b" opacity="0.7">$9B</text>
    <text x="420" y="18" text-anchor="middle" font-family="monospace" font-size="8" fill="#fbbf24" font-weight="bold">$30B</text>
    <!-- Glow behind peak -->
    <circle cx="420" cy="25" r="20" fill="#f59e0b" opacity="0.06"/>
  </g>
  <!-- 80x badge -->
  <g transform="translate(520,100)">
    <rect x="-38" y="-22" width="76" height="44" rx="8" fill="#141425" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fbbf24">80x</text>
    <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="6" fill="#f59e0b" opacity="0.7">YoY GROWTH</text>
  </g>
  <!-- Sparkle dots -->
  <circle cx="140" cy="60" r="1.5" fill="#f59e0b" opacity="0.3"/>
  <circle cx="500" cy="200" r="1.5" fill="#fbbf24" opacity="0.3"/>
  <circle cx="560" cy="60" r="1" fill="#d97706" opacity="0.25"/>
  <!-- Title -->
  <text x="320" y="290" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#fff" opacity="0.95" letter-spacing="0.03em">ANTHROPIC 80x GROWTH</text>
  <text x="320" y="312" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f59e0b" opacity="0.55">$30B ARR, SpaceX Deal &amp; Dreams</text>
</svg>