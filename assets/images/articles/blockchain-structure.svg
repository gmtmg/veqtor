<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="chainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="tamperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ff3c3c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>
  <!-- Title: Normal chain -->
  <text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" opacity="0.6">BLOCKCHAIN STRUCTURE</text>
  <!-- Top row: Normal chain -->
  <text x="60" y="70" font-family="sans-serif" font-size="10" fill="#10b981" opacity="0.6">正常なチェーン</text>
  <!-- Block 0 (Genesis) -->
  <g transform="translate(130,130)">
    <rect x="-55" y="-50" width="110" height="100" rx="6" fill="none" stroke="#7c3aed" stroke-width="1.8" opacity="0.7"/>
    <text x="0" y="-30" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#a78bfa" opacity="0.8">Genesis</text>
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
    <text x="-38" y="-6" font-family="monospace" font-size="7" fill="#a78bfa" opacity="0.5">prev:</text>
    <text x="38" y="-6" text-anchor="end" font-family="monospace" font-size="7" fill="#a78bfa" opacity="0.5">0000</text>
    <text x="-38" y="8" font-family="monospace" font-size="7" fill="#a78bfa" opacity="0.5">data:</text>
    <text x="38" y="8" text-anchor="end" font-family="monospace" font-size="7" fill="#a78bfa" opacity="0.5">...</text>
    <line x1="-40" y1="16" x2="40" y2="16" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
    <text x="-38" y="30" font-family="monospace" font-size="7" fill="#7c3aed" opacity="0.6">hash:</text>
    <text x="38" y="30" text-anchor="end" font-family="monospace" font-size="7" fill="#7c3aed" opacity="0.8">3a7f</text>
  </g>
  <!-- Chain arrow 0→1 -->
  <g opacity="0.5">
    <line x1="185" y1="130" x2="235" y2="130" stroke="url(#chainGrad)" stroke-width="2"/>
    <polygon points="235,130 228,126 228,134" fill="#00d4ff"/>
  </g>
  <!-- Block 1 -->
  <g transform="translate(300,130)">
    <rect x="-55" y="-50" width="110" height="100" rx="6" fill="none" stroke="#00d4ff" stroke-width="1.8" opacity="0.7"/>
    <text x="0" y="-30" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#67e8f9" opacity="0.8">Block #1</text>
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
    <text x="-38" y="-6" font-family="monospace" font-size="7" fill="#67e8f9" opacity="0.5">prev:</text>
    <text x="38" y="-6" text-anchor="end" font-family="monospace" font-size="7" fill="#67e8f9" opacity="0.7">3a7f</text>
    <text x="-38" y="8" font-family="monospace" font-size="7" fill="#67e8f9" opacity="0.5">data:</text>
    <text x="38" y="8" text-anchor="end" font-family="monospace" font-size="7" fill="#67e8f9" opacity="0.5">A→B 1BTC</text>
    <line x1="-40" y1="16" x2="40" y2="16" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
    <text x="-38" y="30" font-family="monospace" font-size="7" fill="#00d4ff" opacity="0.6">hash:</text>
    <text x="38" y="30" text-anchor="end" font-family="monospace" font-size="7" fill="#00d4ff" opacity="0.8">b92c</text>
  </g>
  <!-- Chain arrow 1→2 -->
  <g opacity="0.5">
    <line x1="355" y1="130" x2="405" y2="130" stroke="url(#chainGrad)" stroke-width="2"/>
    <polygon points="405,130 398,126 398,134" fill="#00d4ff"/>
  </g>
  <!-- Block 2 -->
  <g transform="translate(470,130)">
    <rect x="-55" y="-50" width="110" height="100" rx="6" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.7"/>
    <text x="0" y="-30" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#6ee7b7" opacity="0.8">Block #2</text>
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#10b981" stroke-width="0.5" opacity="0.3"/>
    <text x="-38" y="-6" font-family="monospace" font-size="7" fill="#6ee7b7" opacity="0.5">prev:</text>
    <text x="38" y="-6" text-anchor="end" font-family="monospace" font-size="7" fill="#6ee7b7" opacity="0.7">b92c</text>
    <text x="-38" y="8" font-family="monospace" font-size="7" fill="#6ee7b7" opacity="0.5">data:</text>
    <text x="38" y="8" text-anchor="end" font-family="monospace" font-size="7" fill="#6ee7b7" opacity="0.5">C→D 3BTC</text>
    <line x1="-40" y1="16" x2="40" y2="16" stroke="#10b981" stroke-width="0.5" opacity="0.3"/>
    <text x="-38" y="30" font-family="monospace" font-size="7" fill="#10b981" opacity="0.6">hash:</text>
    <text x="38" y="30" text-anchor="end" font-family="monospace" font-size="7" fill="#10b981" opacity="0.8">f41d</text>
  </g>
  <!-- Chain arrow 2→... -->
  <line x1="525" y1="130" x2="575" y2="130" stroke="#10b981" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,4"/>
  <!-- Check marks -->
  <g fill="#10b981" opacity="0.4">
    <text x="130" y="58" text-anchor="middle" font-family="sans-serif" font-size="14">&#10003;</text>
    <text x="300" y="58" text-anchor="middle" font-family="sans-serif" font-size="14">&#10003;</text>
    <text x="470" y="58" text-anchor="middle" font-family="sans-serif" font-size="14">&#10003;</text>
  </g>
  <!-- Divider -->
  <line x1="60" y1="210" x2="740" y2="210" stroke="#ff6b6b" stroke-width="0.5" opacity="0.15"/>
  <!-- Bottom row: Tampered chain -->
  <text x="60" y="240" font-family="sans-serif" font-size="10" fill="#ff6b6b" opacity="0.6">改ざんした場合</text>
  <!-- Block 1 tampered -->
  <g transform="translate(300,320)">
    <rect x="-55" y="-50" width="110" height="100" rx="6" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.8"/>
    <text x="0" y="-30" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#fca5a5" opacity="0.8">Block #1</text>
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#ff6b6b" stroke-width="0.5" opacity="0.3"/>
    <text x="-38" y="-6" font-family="monospace" font-size="7" fill="#fca5a5" opacity="0.5">prev:</text>
    <text x="38" y="-6" text-anchor="end" font-family="monospace" font-size="7" fill="#fca5a5" opacity="0.7">3a7f</text>
    <text x="-38" y="8" font-family="monospace" font-size="7" fill="#ff6b6b" opacity="0.8">data:</text>
    <text x="38" y="8" text-anchor="end" font-family="monospace" font-size="7" fill="#ff6b6b" opacity="0.9">A→B 99BTC</text>
    <line x1="-40" y1="16" x2="40" y2="16" stroke="#ff6b6b" stroke-width="0.5" opacity="0.3"/>
    <text x="-38" y="30" font-family="monospace" font-size="7" fill="#ff6b6b" opacity="0.6">hash:</text>
    <text x="38" y="30" text-anchor="end" font-family="monospace" font-size="7" fill="#ff6b6b" opacity="0.9">x7e2</text>
    <!-- Warning icon -->
    <text x="48" y="-40" font-family="sans-serif" font-size="14" fill="#ff6b6b" opacity="0.8">&#9888;</text>
  </g>
  <!-- Broken chain 1→2 -->
  <g opacity="0.6">
    <line x1="355" y1="320" x2="380" y2="320" stroke="#ff6b6b" stroke-width="2"/>
    <line x1="390" y1="320" x2="405" y2="320" stroke="#ff6b6b" stroke-width="2"/>
    <!-- X mark on broken chain -->
    <text x="385" y="315" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ff6b6b">&#10005;</text>
  </g>
  <!-- Block 2 (invalid) -->
  <g transform="translate(470,320)">
    <rect x="-55" y="-50" width="110" height="100" rx="6" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.5" stroke-dasharray="6,3"/>
    <text x="0" y="-30" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#fca5a5" opacity="0.5">Block #2</text>
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#ff6b6b" stroke-width="0.5" opacity="0.2"/>
    <text x="-38" y="-6" font-family="monospace" font-size="7" fill="#fca5a5" opacity="0.4">prev:</text>
    <text x="38" y="-6" text-anchor="end" font-family="monospace" font-size="7" fill="#ff6b6b" opacity="0.7">b92c &#8800; x7e2</text>
    <text x="0" y="20" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ff6b6b" opacity="0.7">不一致!</text>
    <text x="48" y="-40" font-family="sans-serif" font-size="14" fill="#ff6b6b" opacity="0.8">&#9888;</text>
  </g>
  <!-- Annotation -->
  <text x="400" y="388" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888" opacity="0.4">データを改ざんするとハッシュが変わり、チェーン全体の整合性が崩れる</text>
</svg>
