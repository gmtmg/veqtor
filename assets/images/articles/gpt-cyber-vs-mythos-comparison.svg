<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#10101e"/>
    </linearGradient>
  </defs>

  <rect width="760" height="420" rx="12" fill="url(#cbg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="70" x2="760" y2="70"/><line x1="0" y1="140" x2="760" y2="140"/>
    <line x1="0" y1="210" x2="760" y2="210"/><line x1="0" y1="280" x2="760" y2="280"/>
    <line x1="0" y1="350" x2="760" y2="350"/>
    <line x1="190" y1="0" x2="190" y2="420"/><line x1="380" y1="0" x2="380" y2="420"/>
    <line x1="570" y1="0" x2="570" y2="420"/>
  </g>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ff3cac" opacity="0.9" letter-spacing="0.1em">GPT-5.4 CYBER vs CLAUDE MYTHOS PREVIEW</text>

  <!-- Column headers -->
  <rect x="260" y="48" width="200" height="24" rx="4" fill="#10b981" opacity="0.08"/>
  <text x="360" y="64" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">GPT-5.4 Cyber</text>

  <rect x="490" y="48" width="200" height="24" rx="4" fill="#f59e0b" opacity="0.08"/>
  <text x="590" y="64" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b">Claude Mythos</text>

  <!-- Row backgrounds -->
  <rect x="30" y="80" width="700" height="36" rx="4" fill="#fff" opacity="0.02"/>
  <rect x="30" y="152" width="700" height="36" rx="4" fill="#fff" opacity="0.02"/>
  <rect x="30" y="224" width="700" height="36" rx="4" fill="#fff" opacity="0.02"/>
  <rect x="30" y="296" width="700" height="36" rx="4" fill="#fff" opacity="0.02"/>

  <!-- Row labels -->
  <text x="50" y="102" font-family="sans-serif" font-size="10" font-weight="600" fill="#888">開発元</text>
  <text x="50" y="138" font-family="sans-serif" font-size="10" font-weight="600" fill="#888">アクセス</text>
  <text x="50" y="174" font-family="sans-serif" font-size="10" font-weight="600" fill="#888">CTF性能</text>
  <text x="50" y="210" font-family="sans-serif" font-size="10" font-weight="600" fill="#888">ゼロデイ発見</text>
  <text x="50" y="246" font-family="sans-serif" font-size="10" font-weight="600" fill="#888">バイナリ解析</text>
  <text x="50" y="282" font-family="sans-serif" font-size="10" font-weight="600" fill="#888">安全哲学</text>
  <text x="50" y="318" font-family="sans-serif" font-size="10" font-weight="600" fill="#888">公開方針</text>
  <text x="50" y="354" font-family="sans-serif" font-size="10" font-weight="600" fill="#888">リスク</text>

  <!-- GPT-5.4 Cyber column -->
  <text x="360" y="102" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">OpenAI</text>
  <text x="360" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">TAC認定で広くアクセス可</text>
  <text x="360" y="174" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">~60%（推定）</text>
  <text x="360" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">支援型（人間との協働）</text>
  <text x="360" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#10b981">強い（IDA Pro統合級）</text>
  <text x="360" y="282" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#10b981">Broad but Verified</text>
  <text x="360" y="318" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">審査制API（TAC経由）</text>
  <text x="360" y="354" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ef4444">能力拡散・悪用の可能性</text>

  <!-- Claude Mythos column -->
  <text x="590" y="102" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">Anthropic</text>
  <text x="590" y="138" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">社内限定 / 非公開</text>
  <text x="590" y="174" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f59e0b">73%（公式ベンチ）</text>
  <text x="590" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f59e0b">自律発見（ゼロショット）</text>
  <text x="590" y="246" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">強い（推定）</text>
  <text x="590" y="282" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f59e0b">Narrow and Controlled</text>
  <text x="590" y="318" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ccc">非公開（研究目的のみ）</text>
  <text x="590" y="354" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ef4444">制御不能な自律行動</text>

  <!-- Divider lines -->
  <line x1="240" y1="80" x2="240" y2="370" stroke="#2a2a40" stroke-width="1"/>
  <line x1="480" y1="80" x2="480" y2="370" stroke="#2a2a40" stroke-width="1"/>

  <!-- Bottom note -->
  <text x="380" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b6b80" opacity="0.5">同じ「AIセキュリティ」でもアプローチが真逆 ― 能力と安全のトレードオフ</text>
</svg>
