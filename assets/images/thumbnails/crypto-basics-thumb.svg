<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <radialGradient id="glowL" cx="25%" cy="45%" r="30%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glowR" cx="75%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ethGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <!-- Glows -->
  <rect width="640" height="360" fill="url(#glowL)"/>
  <rect width="640" height="360" fill="url(#glowR)"/>
  <!-- Bitcoin symbol -->
  <g transform="translate(200,145)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#f59e0b" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="12" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="bold" fill="#f59e0b" opacity="0.85">&#x20bf;</text>
    <!-- Glow -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.15"/>
  </g>
  <!-- Ethereum symbol -->
  <g transform="translate(440,145)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
    <!-- ETH diamond -->
    <g opacity="0.85" fill="none" stroke="#a78bfa" stroke-width="2">
      <path d="M0,-22 L14,0 L0,8 L-14,0 Z" fill="#7c3aed" fill-opacity="0.15"/>
      <path d="M0,8 L14,0 L0,22 L-14,0 Z" fill="#7c3aed" fill-opacity="0.25"/>
    </g>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.15"/>
  </g>
  <!-- Wallet icon (center) -->
  <g transform="translate(320,145)" opacity="0.5">
    <rect x="-18" y="-14" width="36" height="28" rx="4" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
    <rect x="10" y="-4" width="10" height="8" rx="2" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="15" cy="0" r="1.5" fill="#00d4ff"/>
    <path d="M-12,-14 L-12,-20 L12,-20 L12,-14" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- Connection lines -->
  <line x1="248" y1="145" x2="302" y2="145" stroke="#00d4ff" stroke-width="1" opacity="0.25" stroke-dasharray="4,3"/>
  <line x1="338" y1="145" x2="392" y2="145" stroke="#00d4ff" stroke-width="1" opacity="0.25" stroke-dasharray="4,3"/>
  <!-- Question marks -->
  <g opacity="0.2" font-family="sans-serif" font-weight="bold" fill="#f59e0b">
    <text x="100" y="85" font-size="24">?</text>
    <text x="530" y="95" font-size="20" fill="#7c3aed">?</text>
    <text x="320" y="65" font-size="16" text-anchor="middle" fill="#00d4ff">?</text>
  </g>
  <!-- Floating particles -->
  <g opacity="0.12">
    <circle cx="60" cy="70" r="3" fill="#f59e0b"/>
    <circle cx="580" cy="70" r="3" fill="#7c3aed"/>
    <circle cx="60" cy="260" r="3" fill="#7c3aed"/>
    <circle cx="580" cy="260" r="3" fill="#f59e0b"/>
    <circle cx="150" cy="250" r="2" fill="#00d4ff"/>
    <circle cx="490" cy="250" r="2" fill="#00d4ff"/>
  </g>
  <!-- Title -->
  <text x="320" y="295" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" opacity="0.9">CRYPTO BASICS</text>
  <text x="320" y="315" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888" opacity="0.5">Your First Step into Digital Currency</text>
  <!-- Top label -->
  <text x="320" y="38" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b" opacity="0.4">CRYPTOCURRENCY FUNDAMENTALS</text>
</svg>
