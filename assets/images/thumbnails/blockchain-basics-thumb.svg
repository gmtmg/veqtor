<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <radialGradient id="glowL" cx="20%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glowR" cx="80%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="chainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <!-- Glows -->
  <rect width="640" height="360" fill="url(#glowL)"/>
  <rect width="640" height="360" fill="url(#glowR)"/>
  <!-- Block 1 -->
  <g transform="translate(120,150)">
    <rect x="-50" y="-40" width="100" height="80" rx="6" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.8"/>
    <text x="0" y="-18" text-anchor="middle" font-family="monospace" font-size="8" fill="#7c3aed" opacity="0.6">Block #1</text>
    <line x1="-35" y1="-8" x2="35" y2="-8" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="6" fill="#a78bfa" opacity="0.5">prev: 0000</text>
    <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="6" fill="#a78bfa" opacity="0.5">hash: 3a7f...</text>
    <text x="0" y="27" text-anchor="middle" font-family="monospace" font-size="6" fill="#a78bfa" opacity="0.5">data: [tx...]</text>
    <!-- Glow dot -->
    <circle cx="0" cy="-40" r="3" fill="#7c3aed" opacity="0.4"/>
  </g>
  <!-- Chain link 1→2 -->
  <line x1="170" y1="150" x2="220" y2="150" stroke="url(#chainGrad)" stroke-width="2" opacity="0.6"/>
  <circle cx="195" cy="150" r="2" fill="#00d4ff" opacity="0.5"/>
  <!-- Block 2 -->
  <g transform="translate(270,150)">
    <rect x="-50" y="-40" width="100" height="80" rx="6" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.8"/>
    <text x="0" y="-18" text-anchor="middle" font-family="monospace" font-size="8" fill="#00d4ff" opacity="0.6">Block #2</text>
    <line x1="-35" y1="-8" x2="35" y2="-8" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="6" fill="#67e8f9" opacity="0.5">prev: 3a7f...</text>
    <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="6" fill="#67e8f9" opacity="0.5">hash: b92c...</text>
    <text x="0" y="27" text-anchor="middle" font-family="monospace" font-size="6" fill="#67e8f9" opacity="0.5">data: [tx...]</text>
    <circle cx="0" cy="-40" r="3" fill="#00d4ff" opacity="0.4"/>
  </g>
  <!-- Chain link 2→3 -->
  <line x1="320" y1="150" x2="370" y2="150" stroke="url(#chainGrad)" stroke-width="2" opacity="0.6"/>
  <circle cx="345" cy="150" r="2" fill="#00d4ff" opacity="0.5"/>
  <!-- Block 3 -->
  <g transform="translate(420,150)">
    <rect x="-50" y="-40" width="100" height="80" rx="6" fill="none" stroke="#10b981" stroke-width="2" opacity="0.8"/>
    <text x="0" y="-18" text-anchor="middle" font-family="monospace" font-size="8" fill="#10b981" opacity="0.6">Block #3</text>
    <line x1="-35" y1="-8" x2="35" y2="-8" stroke="#10b981" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="6" fill="#6ee7b7" opacity="0.5">prev: b92c...</text>
    <text x="0" y="16" text-anchor="middle" font-family="monospace" font-size="6" fill="#6ee7b7" opacity="0.5">hash: f41d...</text>
    <text x="0" y="27" text-anchor="middle" font-family="monospace" font-size="6" fill="#6ee7b7" opacity="0.5">data: [tx...]</text>
    <circle cx="0" cy="-40" r="3" fill="#10b981" opacity="0.4"/>
  </g>
  <!-- Chain link 3→... -->
  <line x1="470" y1="150" x2="520" y2="150" stroke="#10b981" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,4"/>
  <!-- Lock icon (top-right) -->
  <g transform="translate(560,70)" opacity="0.15">
    <rect x="-10" y="-2" width="20" height="16" rx="3" stroke="#00d4ff" stroke-width="1.5" fill="none"/>
    <path d="M-6,-2 L-6,-8 A6,6 0 0 1 6,-8 L6,-2" stroke="#00d4ff" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="7" r="2" fill="#00d4ff"/>
  </g>
  <!-- Distributed nodes (small circles around) -->
  <g opacity="0.12">
    <circle cx="50" cy="60" r="4" fill="#7c3aed"/><circle cx="590" cy="60" r="4" fill="#00d4ff"/>
    <circle cx="50" cy="280" r="4" fill="#10b981"/><circle cx="590" cy="280" r="4" fill="#7c3aed"/>
    <circle cx="320" cy="50" r="3" fill="#00d4ff"/><circle cx="320" cy="260" r="3" fill="#10b981"/>
    <line x1="50" y1="60" x2="320" y2="50" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="590" y1="60" x2="320" y2="50" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="50" y1="280" x2="320" y2="260" stroke="#10b981" stroke-width="0.5"/>
    <line x1="590" y1="280" x2="320" y2="260" stroke="#7c3aed" stroke-width="0.5"/>
  </g>
  <!-- Title -->
  <text x="320" y="305" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" opacity="0.9">BLOCKCHAIN BASICS</text>
  <text x="320" y="325" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888" opacity="0.5">The Immutable Ledger</text>
  <!-- Top label -->
  <text x="320" y="38" text-anchor="middle" font-family="monospace" font-size="7" fill="#7c3aed" opacity="0.4">DISTRIBUTED LEDGER TECHNOLOGY</text>
</svg>
