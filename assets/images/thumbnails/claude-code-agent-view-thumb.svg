<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ff3cac"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.06">
    <line x1="0" y1="75" x2="800" y2="75" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="225" x2="800" y2="225" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="375" x2="800" y2="375" stroke="#fff" stroke-width="0.5"/>
    <line x1="133" y1="0" x2="133" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="266" y1="0" x2="266" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="533" y1="0" x2="533" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="666" y1="0" x2="666" y2="450" stroke="#fff" stroke-width="0.5"/>
  </g>
  <!-- Orbs -->
  <circle cx="650" cy="100" r="140" fill="url(#glow1)" opacity="0.6"/>
  <circle cx="150" cy="350" r="100" fill="#7c3aed" opacity="0.06"/>
  <!-- Dashboard rows -->
  <g transform="translate(120, 55)">
    <!-- Header -->
    <rect width="560" height="30" rx="6" fill="#0e0e18" stroke="#1e1e30" stroke-width="1"/>
    <text x="16" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#6b6b80">claude agents</text>
    <text x="440" y="20" font-family="JetBrains Mono, monospace" font-size="9" fill="#6b6b80">3 sessions</text>
    <!-- Row 1: Working (animated) -->
    <rect y="38" width="560" height="42" rx="6" fill="#0e0e18" stroke="#1e1e30" stroke-width="1"/>
    <circle cx="22" cy="59" r="5" fill="#00d4ff" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="63" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ffffff">collision detection</text>
    <text x="300" y="63" font-family="JetBrains Mono, monospace" font-size="10" fill="#6b6b80">Edit CollisionSystem.ts</text>
    <text x="520" y="63" text-anchor="end" font-family="Inter, sans-serif" font-size="9" fill="#6b6b80">2m</text>
    <!-- Row 2: Needs input (yellow) -->
    <rect y="86" width="560" height="42" rx="6" fill="#0e0e18" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    <circle cx="22" cy="107" r="5" fill="#f59e0b"/>
    <text x="40" y="111" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ffffff">power-up design</text>
    <text x="300" y="111" font-family="JetBrains Mono, monospace" font-size="10" fill="#f59e0b">double jump or wall climb?</text>
    <text x="520" y="111" text-anchor="end" font-family="Inter, sans-serif" font-size="9" fill="#6b6b80">1m</text>
    <!-- Row 3: Completed (green) -->
    <rect y="134" width="560" height="42" rx="6" fill="#0e0e18" stroke="#1e1e30" stroke-width="1"/>
    <circle cx="22" cy="155" r="5" fill="#10b981"/>
    <text x="40" y="159" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ffffff">title screen</text>
    <text x="300" y="159" font-family="JetBrains Mono, monospace" font-size="10" fill="#10b981">done: menu + credits</text>
    <text x="520" y="159" text-anchor="end" font-family="Inter, sans-serif" font-size="9" fill="#6b6b80">9m</text>
    <!-- Dispatch input -->
    <rect y="190" width="560" height="34" rx="6" fill="#0e0e18" stroke="url(#accent)" stroke-width="1"/>
    <text x="16" y="212" font-family="JetBrains Mono, monospace" font-size="11" fill="#6b6b80">Dispatch a new task...</text>
    <rect x="14" y="201" width="2" height="14" fill="#00d4ff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- /goal indicator -->
  <g transform="translate(140, 320)">
    <rect width="200" height="28" rx="14" fill="#0e0e18" stroke="#7c3aed" stroke-width="1"/>
    <circle cx="18" cy="14" r="4" fill="#7c3aed"/>
    <text x="30" y="18" font-family="JetBrains Mono, monospace" font-size="10" fill="#7c3aed">/goal active</text>
    <text x="140" y="18" font-family="Inter, sans-serif" font-size="9" fill="#6b6b80">12 turns</text>
  </g>
  <!-- Title -->
  <text x="400" y="375" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#ffffff">Agent View &amp; /goal</text>
  <text x="400" y="405" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#6b6b80">Multi-agent orchestration from one screen</text>
</svg>
