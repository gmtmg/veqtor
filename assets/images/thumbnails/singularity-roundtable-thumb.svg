<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0e0e18"/>
    </linearGradient>
    <radialGradient id="singGlow" cx="50%" cy="44%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <!-- Ambient glow -->
  <rect width="640" height="360" fill="url(#singGlow)"/>
  <!-- Pentagon edges (connecting all 5 nodes) -->
  <g stroke-width="1" opacity="0.2" fill="none">
    <line x1="320" y1="68" x2="452" y2="164" stroke="#00d4ff"/>
    <line x1="452" y1="164" x2="401" y2="288" stroke="#ff3cac"/>
    <line x1="401" y1="288" x2="239" y2="288" stroke="#7c3aed"/>
    <line x1="239" y1="288" x2="188" y2="164" stroke="#f59e0b"/>
    <line x1="188" y1="164" x2="320" y2="68" stroke="#10b981"/>
  </g>
  <!-- Inner star edges (pentagram) -->
  <g stroke-width="0.6" opacity="0.12" fill="none">
    <line x1="320" y1="68" x2="401" y2="288" stroke="#fff"/>
    <line x1="320" y1="68" x2="239" y2="288" stroke="#fff"/>
    <line x1="452" y1="164" x2="239" y2="288" stroke="#fff"/>
    <line x1="452" y1="164" x2="401" y2="288" stroke="#fff"/>
    <line x1="188" y1="164" x2="401" y2="288" stroke="#fff"/>
  </g>
  <!-- Lines to center (singularity) -->
  <g stroke-width="1.2" opacity="0.25">
    <line x1="320" y1="68" x2="320" y2="180" stroke="#00d4ff"/>
    <line x1="452" y1="164" x2="320" y2="180" stroke="#ff3cac"/>
    <line x1="401" y1="288" x2="320" y2="180" stroke="#7c3aed"/>
    <line x1="239" y1="288" x2="320" y2="180" stroke="#f59e0b"/>
    <line x1="188" y1="164" x2="320" y2="180" stroke="#10b981"/>
  </g>
  <!-- Central singularity point -->
  <circle cx="320" cy="180" r="12" fill="url(#coreGlow)"/>
  <circle cx="320" cy="180" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="320" cy="180" r="20" fill="none" stroke="#fff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="320" cy="180" r="30" fill="none" stroke="#fff" stroke-width="0.3" opacity="0.08"/>
  <!-- 5 writer nodes (pentagon vertices) -->
  <!-- Compass (top) -->
  <circle cx="320" cy="68" r="10" fill="#0a0a18" stroke="#00d4ff" stroke-width="2" opacity="0.9"/>
  <circle cx="320" cy="68" r="4" fill="#00d4ff" opacity="0.6"/>
  <text x="320" y="52" text-anchor="middle" font-family="monospace" font-size="7" fill="#00d4ff" opacity="0.7">COMPASS</text>
  <!-- Bolt (top-right) -->
  <circle cx="452" cy="164" r="10" fill="#0a0a18" stroke="#ff3cac" stroke-width="2" opacity="0.9"/>
  <circle cx="452" cy="164" r="4" fill="#ff3cac" opacity="0.6"/>
  <text x="474" y="158" text-anchor="start" font-family="monospace" font-size="7" fill="#ff3cac" opacity="0.7">BOLT</text>
  <!-- Aegis (bottom-right) -->
  <circle cx="401" cy="288" r="10" fill="#0a0a18" stroke="#7c3aed" stroke-width="2" opacity="0.9"/>
  <circle cx="401" cy="288" r="4" fill="#7c3aed" opacity="0.6"/>
  <text x="423" y="296" text-anchor="start" font-family="monospace" font-size="7" fill="#7c3aed" opacity="0.7">AEGIS</text>
  <!-- Prism (bottom-left) -->
  <circle cx="239" cy="288" r="10" fill="#0a0a18" stroke="#f59e0b" stroke-width="2" opacity="0.9"/>
  <circle cx="239" cy="288" r="4" fill="#f59e0b" opacity="0.6"/>
  <text x="217" y="296" text-anchor="end" font-family="monospace" font-size="7" fill="#f59e0b" opacity="0.7">PRISM</text>
  <!-- Syntax (top-left) -->
  <circle cx="188" cy="164" r="10" fill="#0a0a18" stroke="#10b981" stroke-width="2" opacity="0.9"/>
  <circle cx="188" cy="164" r="4" fill="#10b981" opacity="0.6"/>
  <text x="166" y="158" text-anchor="end" font-family="monospace" font-size="7" fill="#10b981" opacity="0.7">SYNTAX</text>
  <!-- Title -->
  <text x="320" y="332" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" opacity="0.9">SINGULARITY ROUNDTABLE</text>
  <text x="320" y="350" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888" opacity="0.5">5 AI Writers Discuss the Singularity</text>
</svg>
