<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0e0e18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <!-- Function box (main visual) -->
  <g transform="translate(320,150)">
    <rect x="-120" y="-50" width="240" height="100" rx="8" fill="#141425" stroke="url(#accent)" stroke-width="1.5" opacity="0.7"/>
    <!-- Input arrow -->
    <line x1="-170" y1="0" x2="-130" y2="0" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
    <polygon points="-130,-5 -120,0 -130,5" fill="#00d4ff" opacity="0.6"/>
    <!-- Output arrow -->
    <line x1="120" y1="0" x2="160" y2="0" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
    <polygon points="160,-5 170,0 160,5" fill="#f59e0b" opacity="0.6"/>
    <!-- def keyword -->
    <text x="-90" y="-15" font-family="monospace" font-size="13" fill="#a78bfa" opacity="0.9">def</text>
    <text x="-55" y="-15" font-family="monospace" font-size="13" fill="#fff" opacity="0.8">greet(name):</text>
    <text x="-70" y="10" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.6">return</text>
    <text x="-15" y="10" font-family="monospace" font-size="11" fill="#fff" opacity="0.5">f"Hello {name}"</text>
  </g>
  <!-- Input label -->
  <text x="115" y="145" font-family="monospace" font-size="9" fill="#00d4ff" opacity="0.4">input</text>
  <!-- Output label -->
  <text x="500" y="145" font-family="monospace" font-size="9" fill="#f59e0b" opacity="0.4">output</text>
  <!-- Sparkle dots -->
  <circle cx="200" cy="100" r="2" fill="#00d4ff" opacity="0.5"/>
  <circle cx="460" cy="110" r="2" fill="#a78bfa" opacity="0.4"/>
  <circle cx="380" cy="230" r="2" fill="#f59e0b" opacity="0.3"/>
  <circle cx="250" cy="240" r="2" fill="#00d4ff" opacity="0.3"/>
  <!-- Title text -->
  <text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" opacity="0.9">PYTHON FUNCTIONS</text>
  <text x="320" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888" opacity="0.6">def, return, arguments &#8212; Interactive Tutorial</text>
</svg>
