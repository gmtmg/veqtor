<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#10101e"/>
    </linearGradient>
    <linearGradient id="git-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f05033"/>
      <stop offset="100%" stop-color="#f14e32"/>
    </linearGradient>
    <linearGradient id="stage-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="commit-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="push-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="760" height="400" rx="12" fill="url(#hbg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="760" y2="100"/><line x1="0" y1="200" x2="760" y2="200"/>
    <line x1="0" y1="300" x2="760" y2="300"/>
    <line x1="190" y1="0" x2="190" y2="400"/><line x1="380" y1="0" x2="380" y2="400"/>
    <line x1="570" y1="0" x2="570" y2="400"/>
  </g>

  <!-- Title -->
  <text x="380" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#f05033" opacity="0.9" letter-spacing="0.1em">GIT BASIC FLOW</text>

  <!-- ===== Step 1: Working Directory ===== -->
  <g transform="translate(110,170)">
    <rect x="-70" y="-55" width="140" height="110" rx="8" fill="#141425" stroke="#f05033" stroke-width="1.5"/>
    <text x="0" y="-35" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#f05033" opacity="0.9">Working Dir</text>
    <text x="0" y="-18" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a0a0b0" opacity="0.6">ワーキングツリー</text>
    <!-- File icons -->
    <g transform="translate(-30,8)" opacity="0.7">
      <rect x="0" y="0" width="18" height="22" rx="2" fill="none" stroke="#f05033" stroke-width="1"/>
      <line x1="4" y1="6" x2="14" y2="6" stroke="#f05033" stroke-width="0.6" opacity="0.5"/>
      <line x1="4" y1="10" x2="12" y2="10" stroke="#f05033" stroke-width="0.6" opacity="0.5"/>
      <line x1="4" y1="14" x2="10" y2="14" stroke="#f05033" stroke-width="0.6" opacity="0.5"/>
    </g>
    <g transform="translate(-5,8)" opacity="0.7">
      <rect x="0" y="0" width="18" height="22" rx="2" fill="none" stroke="#f05033" stroke-width="1"/>
      <text x="9" y="15" text-anchor="middle" font-family="monospace" font-size="7" fill="#f05033" opacity="0.6">+</text>
    </g>
    <g transform="translate(20,8)" opacity="0.5">
      <rect x="0" y="0" width="18" height="22" rx="2" fill="none" stroke="#f05033" stroke-width="0.8"/>
      <line x1="4" y1="6" x2="14" y2="6" stroke="#f05033" stroke-width="0.5" opacity="0.4"/>
      <line x1="4" y1="10" x2="12" y2="10" stroke="#f05033" stroke-width="0.5" opacity="0.4"/>
    </g>
  </g>

  <!-- Arrow 1: git add -->
  <g transform="translate(195,165)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#eab308" stroke-width="1.5" opacity="0.7"/>
    <polygon points="60,-4 68,0 60,4" fill="#eab308" opacity="0.7"/>
    <text x="30" y="-12" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#eab308" opacity="0.85">git add</text>
  </g>

  <!-- ===== Step 2: Staging Area ===== -->
  <g transform="translate(320,170)">
    <rect x="-50" y="-55" width="100" height="110" rx="8" fill="#141425" stroke="#eab308" stroke-width="1.5"/>
    <text x="0" y="-35" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#eab308" opacity="0.9">Staging</text>
    <text x="0" y="-18" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a0a0b0" opacity="0.6">ステージング</text>
    <!-- Clipboard icon -->
    <g transform="translate(-12,5)" opacity="0.7">
      <rect x="0" y="0" width="24" height="30" rx="3" fill="none" stroke="#eab308" stroke-width="1.2"/>
      <rect x="6" y="-3" width="12" height="6" rx="2" fill="#141425" stroke="#eab308" stroke-width="1"/>
      <line x1="5" y1="11" x2="19" y2="11" stroke="#eab308" stroke-width="0.6" opacity="0.5"/>
      <line x1="5" y1="17" x2="19" y2="17" stroke="#eab308" stroke-width="0.6" opacity="0.5"/>
      <line x1="5" y1="23" x2="15" y2="23" stroke="#eab308" stroke-width="0.6" opacity="0.5"/>
    </g>
  </g>

  <!-- Arrow 2: git commit -->
  <g transform="translate(385,165)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <polygon points="55,-4 63,0 55,4" fill="#10b981" opacity="0.7"/>
    <text x="28" y="-12" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#10b981" opacity="0.85">git commit</text>
  </g>

  <!-- ===== Step 3: Local Repository ===== -->
  <g transform="translate(510,170)">
    <rect x="-55" y="-55" width="110" height="110" rx="8" fill="#141425" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="-35" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#10b981" opacity="0.9">Repository</text>
    <text x="0" y="-18" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a0a0b0" opacity="0.6">ローカルリポジトリ</text>
    <!-- Commit chain -->
    <g transform="translate(-20,12)" opacity="0.7">
      <circle cx="0" cy="0" r="7" fill="#141425" stroke="#10b981" stroke-width="1.3"/>
      <line x1="7" y1="0" x2="18" y2="0" stroke="#10b981" stroke-width="1" opacity="0.5"/>
      <circle cx="25" cy="0" r="7" fill="#141425" stroke="#10b981" stroke-width="1.3"/>
      <line x1="32" y1="0" x2="43" y2="0" stroke="#10b981" stroke-width="1" opacity="0.5"/>
      <circle cx="50" cy="0" r="7" fill="#141425" stroke="#34d399" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Arrow 3: git push -->
  <g transform="translate(580,165)">
    <line x1="0" y1="0" x2="55" y2="0" stroke="#8b5cf6" stroke-width="1.5" opacity="0.7"/>
    <polygon points="55,-4 63,0 55,4" fill="#8b5cf6" opacity="0.7"/>
    <text x="28" y="-12" text-anchor="middle" font-family="monospace" font-size="10" font-weight="600" fill="#8b5cf6" opacity="0.85">git push</text>
  </g>

  <!-- ===== Step 4: Remote (GitHub) ===== -->
  <g transform="translate(690,170)">
    <rect x="-42" y="-55" width="84" height="110" rx="8" fill="#141425" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="0" y="-35" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#8b5cf6" opacity="0.9">Remote</text>
    <text x="0" y="-18" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a0a0b0" opacity="0.6">GitHub</text>
    <!-- Cloud icon -->
    <g transform="translate(0,10)" opacity="0.7">
      <ellipse cx="0" cy="0" rx="24" ry="14" fill="none" stroke="#8b5cf6" stroke-width="1.2"/>
      <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8b5cf6" opacity="0.7">GH</text>
    </g>
  </g>

  <!-- Game analogy labels at bottom -->
  <g transform="translate(110,290)">
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#f05033" fill-opacity="0.08" stroke="#f05033" stroke-width="0.8" opacity="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#f05033" opacity="0.7">ファイルを編集</text>
  </g>
  <g transform="translate(320,290)">
    <rect x="-55" y="-12" width="110" height="24" rx="12" fill="#eab308" fill-opacity="0.08" stroke="#eab308" stroke-width="0.8" opacity="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#eab308" opacity="0.7">セーブ準備</text>
  </g>
  <g transform="translate(510,290)">
    <rect x="-55" y="-12" width="110" height="24" rx="12" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#10b981" opacity="0.7">セーブ確定!</text>
  </g>
  <g transform="translate(690,290)">
    <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.08" stroke="#8b5cf6" stroke-width="0.8" opacity="0.5"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#8b5cf6" opacity="0.7">共有!</text>
  </g>

  <!-- Bottom summary -->
  <g transform="translate(380,365)">
    <rect x="-220" y="-16" width="440" height="32" rx="16" fill="#f05033" fill-opacity="0.05" stroke="#f05033" stroke-width="0.8" opacity="0.4"/>
    <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#a0a0b0" opacity="0.8">edit → add（準備）→ commit（確定）→ push（共有）</text>
  </g>
</svg>
