<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ff3cac"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff3cac" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="step-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ff3cac"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.06">
    <line x1="0" y1="75" x2="800" y2="75" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="225" x2="800" y2="225" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="375" x2="800" y2="375" stroke="#fff" stroke-width="0.5"/>
    <line x1="133" y1="0" x2="133" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="266" y1="0" x2="266" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="533" y1="0" x2="533" y2="450" stroke="#fff" stroke-width="0.5"/>
    <line x1="666" y1="0" x2="666" y2="450" stroke="#fff" stroke-width="0.5"/>
  </g>
  <!-- Orbs -->
  <circle cx="150" cy="120" r="160" fill="url(#glow1)" opacity="0.7"/>
  <circle cx="680" cy="360" r="130" fill="url(#glow2)" opacity="0.6"/>
  <!-- Step progress line -->
  <line x1="170" y1="260" x2="630" y2="260" stroke="url(#step-line)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Step nodes -->
  <circle cx="170" cy="260" r="14" fill="#0e0e18" stroke="#00d4ff" stroke-width="2.5"/>
  <text x="170" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#00d4ff">1</text>
  <text x="170" y="295" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6b6b80">基礎</text>
  <circle cx="300" cy="260" r="14" fill="#0e0e18" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="300" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#7c3aed">2</text>
  <text x="300" y="295" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6b6b80">実践</text>
  <circle cx="430" cy="260" r="14" fill="#0e0e18" stroke="#ff3cac" stroke-width="2.5"/>
  <text x="430" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ff3cac">3</text>
  <text x="430" y="295" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6b6b80">MCP</text>
  <circle cx="545" cy="260" r="14" fill="#0e0e18" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="545" y="265" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">4</text>
  <text x="545" y="295" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#6b6b80">Prompt</text>
  <!-- Completion check -->
  <circle cx="630" cy="260" r="12" fill="#0e0e18" stroke="#10b981" stroke-width="2"/>
  <path d="M624 260l3.5 3.5 7-7" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Main title -->
  <text x="400" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="48" font-weight="900" fill="#ffffff">Claude Code</text>
  <text x="400" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#6b6b80">学習ロードマップ</text>
  <!-- Article count badge -->
  <rect x="330" y="340" width="140" height="32" rx="16" fill="#0e0e18" stroke="url(#accent)" stroke-width="1"/>
  <text x="400" y="361" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a0a0b8">全9記事収録</text>
</svg>
