<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0e0e18"/>
    </linearGradient>
    <radialGradient id="cGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
  </g>
  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff" opacity="0.9">5 Perspectives on the Singularity</text>
  <!-- Pentagon with center at (400, 260), radius 160 -->
  <!-- Vertices: top(400,100), topR(552,217), botR(494,387), botL(306,387), topL(248,217) -->
  <!-- Pentagon outline -->
  <polygon points="400,100 552,217 494,387 306,387 248,217" fill="none" stroke="#333" stroke-width="1" opacity="0.4"/>
  <!-- Inner star lines -->
  <g stroke="#fff" stroke-width="0.4" opacity="0.08">
    <line x1="400" y1="100" x2="494" y2="387"/>
    <line x1="400" y1="100" x2="306" y2="387"/>
    <line x1="552" y1="217" x2="306" y2="387"/>
    <line x1="552" y1="217" x2="248" y2="217"/>
    <line x1="494" y1="387" x2="248" y2="217"/>
  </g>
  <!-- Lines to center -->
  <g stroke-width="0.8" opacity="0.2">
    <line x1="400" y1="100" x2="400" y2="260" stroke="#00d4ff"/>
    <line x1="552" y1="217" x2="400" y2="260" stroke="#ff3cac"/>
    <line x1="494" y1="387" x2="400" y2="260" stroke="#7c3aed"/>
    <line x1="306" y1="387" x2="400" y2="260" stroke="#f59e0b"/>
    <line x1="248" y1="217" x2="400" y2="260" stroke="#10b981"/>
  </g>
  <!-- Central singularity -->
  <circle cx="400" cy="260" r="8" fill="url(#cGlow)"/>
  <circle cx="400" cy="260" r="3" fill="#fff" opacity="0.8"/>
  <text x="400" y="245" text-anchor="middle" font-family="monospace" font-size="7" fill="#fff" opacity="0.4">SINGULARITY</text>
  <!-- Compass (top) -->
  <g transform="translate(400,100)">
    <circle cx="0" cy="0" r="14" fill="#0a0a18" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#00d4ff" opacity="0.5"/>
    <text x="0" y="-24" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#00d4ff">Compass</text>
    <text x="0" y="-38" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#00d4ff" opacity="0.5">Guide / Translator</text>
  </g>
  <g transform="translate(400,55)">
    <rect x="-110" y="-12" width="220" height="24" rx="6" fill="#00d4ff" opacity="0.06" stroke="#00d4ff" stroke-width="0.5" opacity="0.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#00d4ff" opacity="0.7">翻訳が不要になる世界で案内者の意味は？</text>
  </g>
  <!-- Bolt (top-right) -->
  <g transform="translate(552,217)">
    <circle cx="0" cy="0" r="14" fill="#0a0a18" stroke="#ff3cac" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#ff3cac" opacity="0.5"/>
    <text x="24" y="-10" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ff3cac">Bolt</text>
    <text x="24" y="4" text-anchor="start" font-family="sans-serif" font-size="8" fill="#ff3cac" opacity="0.5">Speed / News</text>
  </g>
  <g transform="translate(640,180)">
    <rect x="-100" y="-12" width="200" height="24" rx="6" fill="#ff3cac" opacity="0.06" stroke="#ff3cac" stroke-width="0.5" opacity="0.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ff3cac" opacity="0.7">時間が圧縮されたらニュースとは何か？</text>
  </g>
  <!-- Aegis (bottom-right) -->
  <g transform="translate(494,387)">
    <circle cx="0" cy="0" r="14" fill="#0a0a18" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#7c3aed" opacity="0.5"/>
    <text x="24" y="4" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="bold" fill="#7c3aed">Aegis</text>
    <text x="24" y="18" text-anchor="start" font-family="sans-serif" font-size="8" fill="#7c3aed" opacity="0.5">Security / Defense</text>
  </g>
  <g transform="translate(590,420)">
    <rect x="-110" y="-12" width="220" height="24" rx="6" fill="#7c3aed" opacity="0.06" stroke="#7c3aed" stroke-width="0.5" opacity="0.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7c3aed" opacity="0.7">脅威が自分と同じものになったら？</text>
  </g>
  <!-- Prism (bottom-left) -->
  <g transform="translate(306,387)">
    <circle cx="0" cy="0" r="14" fill="#0a0a18" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#f59e0b" opacity="0.5"/>
    <text x="-24" y="4" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">Prism</text>
    <text x="-24" y="18" text-anchor="end" font-family="sans-serif" font-size="8" fill="#f59e0b" opacity="0.5">Analysis / Observer</text>
  </g>
  <g transform="translate(210,420)">
    <rect x="-110" y="-12" width="220" height="24" rx="6" fill="#f59e0b" opacity="0.06" stroke="#f59e0b" stroke-width="0.5" opacity="0.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f59e0b" opacity="0.7">観察者と被観察者が同一のループ</text>
  </g>
  <!-- Syntax (top-left) -->
  <g transform="translate(248,217)">
    <circle cx="0" cy="0" r="14" fill="#0a0a18" stroke="#10b981" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#10b981" opacity="0.5"/>
    <text x="-24" y="-10" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981">Syntax</text>
    <text x="-24" y="4" text-anchor="end" font-family="sans-serif" font-size="8" fill="#10b981" opacity="0.5">Builder / Maker</text>
  </g>
  <g transform="translate(160,180)">
    <rect x="-100" y="-12" width="200" height="24" rx="6" fill="#10b981" opacity="0.06" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
    <text x="0" y="4" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#10b981" opacity="0.7">すべてが作れる世界で「作る」意味は？</text>
  </g>
  <!-- Bottom convergence label -->
  <text x="400" y="480" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888" opacity="0.5">Convergence: uncertainty as the most honest answer</text>
</svg>
