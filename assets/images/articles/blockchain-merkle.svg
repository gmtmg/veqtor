<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="720" height="420" fill="url(#bg)"/>
  <rect width="720" height="420" fill="url(#glow)"/>
  <!-- Grid -->
  <g opacity="0.025" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="70" x2="720" y2="70"/><line x1="0" y1="140" x2="720" y2="140"/>
    <line x1="0" y1="210" x2="720" y2="210"/><line x1="0" y1="280" x2="720" y2="280"/>
    <line x1="0" y1="350" x2="720" y2="350"/>
    <line x1="90" y1="0" x2="90" y2="420"/><line x1="180" y1="0" x2="180" y2="420"/>
    <line x1="270" y1="0" x2="270" y2="420"/><line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/><line x1="540" y1="0" x2="540" y2="420"/>
    <line x1="630" y1="0" x2="630" y2="420"/>
  </g>

  <!-- Title -->
  <text x="360" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981" opacity="0.8">Merkle Tree</text>
  <text x="360" y="52" text-anchor="middle" font-family="monospace" font-size="8" fill="#6ee7b7" opacity="0.4">Binary Hash Tree Structure</text>

  <!-- Level labels -->
  <text x="30" y="98" text-anchor="middle" font-family="monospace" font-size="7" fill="#888" opacity="0.4">Root</text>
  <text x="30" y="178" text-anchor="middle" font-family="monospace" font-size="7" fill="#888" opacity="0.4">Level 1</text>
  <text x="30" y="258" text-anchor="middle" font-family="monospace" font-size="7" fill="#888" opacity="0.4">Level 2</text>
  <text x="30" y="345" text-anchor="middle" font-family="monospace" font-size="7" fill="#888" opacity="0.4">Data</text>

  <!-- ROOT node -->
  <g transform="translate(360,90)">
    <rect x="-55" y="-18" width="110" height="28" rx="4" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" opacity="0.6">Merkle Root</text>
    <text x="0" y="7" text-anchor="middle" font-family="monospace" font-size="6" fill="#6ee7b7" opacity="0.8">H(H_AB + H_CD)</text>
  </g>

  <!-- Lines Root → Level 1 -->
  <line x1="320" y1="108" x2="220" y2="155" stroke="#10b981" stroke-width="1.2" opacity="0.4"/>
  <line x1="400" y1="108" x2="500" y2="155" stroke="#10b981" stroke-width="1.2" opacity="0.4"/>

  <!-- Level 1: H_AB -->
  <g transform="translate(220,170)">
    <rect x="-50" y="-18" width="100" height="28" rx="4" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="-3" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" opacity="0.6">H_AB</text>
    <text x="0" y="7" text-anchor="middle" font-family="monospace" font-size="6" fill="#6ee7b7" opacity="0.7">H(H_A + H_B)</text>
  </g>

  <!-- Level 1: H_CD -->
  <g transform="translate(500,170)">
    <rect x="-50" y="-18" width="100" height="28" rx="4" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    <text x="0" y="-3" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" opacity="0.6">H_CD</text>
    <text x="0" y="7" text-anchor="middle" font-family="monospace" font-size="6" fill="#6ee7b7" opacity="0.7">H(H_C + H_D)</text>
  </g>

  <!-- Lines Level 1 → Level 2 -->
  <line x1="185" y1="188" x2="140" y2="235" stroke="#10b981" stroke-width="1" opacity="0.35"/>
  <line x1="255" y1="188" x2="300" y2="235" stroke="#10b981" stroke-width="1" opacity="0.35"/>
  <line x1="465" y1="188" x2="420" y2="235" stroke="#10b981" stroke-width="1" opacity="0.35"/>
  <line x1="535" y1="188" x2="580" y2="235" stroke="#10b981" stroke-width="1" opacity="0.35"/>

  <!-- Level 2: H_A -->
  <g transform="translate(140,250)">
    <rect x="-40" y="-18" width="80" height="28" rx="4" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <text x="0" y="-3" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" opacity="0.5">H_A</text>
    <text x="0" y="7" text-anchor="middle" font-family="monospace" font-size="6" fill="#6ee7b7" opacity="0.5">Hash(Tx A)</text>
  </g>

  <!-- Level 2: H_B -->
  <g transform="translate(300,250)">
    <rect x="-40" y="-18" width="80" height="28" rx="4" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <text x="0" y="-3" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" opacity="0.5">H_B</text>
    <text x="0" y="7" text-anchor="middle" font-family="monospace" font-size="6" fill="#6ee7b7" opacity="0.5">Hash(Tx B)</text>
  </g>

  <!-- Level 2: H_C -->
  <g transform="translate(420,250)">
    <rect x="-40" y="-18" width="80" height="28" rx="4" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <text x="0" y="-3" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" opacity="0.5">H_C</text>
    <text x="0" y="7" text-anchor="middle" font-family="monospace" font-size="6" fill="#6ee7b7" opacity="0.5">Hash(Tx C)</text>
  </g>

  <!-- Level 2: H_D -->
  <g transform="translate(580,250)">
    <rect x="-40" y="-18" width="80" height="28" rx="4" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <text x="0" y="-3" text-anchor="middle" font-family="monospace" font-size="7" fill="#10b981" opacity="0.5">H_D</text>
    <text x="0" y="7" text-anchor="middle" font-family="monospace" font-size="6" fill="#6ee7b7" opacity="0.5">Hash(Tx D)</text>
  </g>

  <!-- Lines Level 2 → Data -->
  <line x1="140" y1="268" x2="140" y2="315" stroke="#10b981" stroke-width="0.8" opacity="0.25"/>
  <line x1="300" y1="268" x2="300" y2="315" stroke="#10b981" stroke-width="0.8" opacity="0.25"/>
  <line x1="420" y1="268" x2="420" y2="315" stroke="#10b981" stroke-width="0.8" opacity="0.25"/>
  <line x1="580" y1="268" x2="580" y2="315" stroke="#10b981" stroke-width="0.8" opacity="0.25"/>

  <!-- Data blocks -->
  <g transform="translate(140,335)">
    <rect x="-40" y="-18" width="80" height="28" rx="4" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="0" y="-2" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#f59e0b" opacity="0.6">Tx A</text>
    <text x="0" y="8" text-anchor="middle" font-family="monospace" font-size="5" fill="#fbbf24" opacity="0.4">A sends 1 BTC</text>
  </g>
  <g transform="translate(300,335)">
    <rect x="-40" y="-18" width="80" height="28" rx="4" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="0" y="-2" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#f59e0b" opacity="0.6">Tx B</text>
    <text x="0" y="8" text-anchor="middle" font-family="monospace" font-size="5" fill="#fbbf24" opacity="0.4">B sends 0.5 BTC</text>
  </g>
  <g transform="translate(420,335)">
    <rect x="-40" y="-18" width="80" height="28" rx="4" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="0" y="-2" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#f59e0b" opacity="0.6">Tx C</text>
    <text x="0" y="8" text-anchor="middle" font-family="monospace" font-size="5" fill="#fbbf24" opacity="0.4">C sends 2 BTC</text>
  </g>
  <g transform="translate(580,335)">
    <rect x="-40" y="-18" width="80" height="28" rx="4" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>
    <text x="0" y="-2" text-anchor="middle" font-family="monospace" font-size="6.5" fill="#f59e0b" opacity="0.6">Tx D</text>
    <text x="0" y="8" text-anchor="middle" font-family="monospace" font-size="5" fill="#fbbf24" opacity="0.4">D sends 3 BTC</text>
  </g>

  <!-- Verification highlight path (Tx C) -->
  <g opacity="0.15">
    <rect x="378" y="315" width="84" height="32" rx="6" fill="#00d4ff"/>
    <rect x="258" y="230" width="84" height="32" rx="6" fill="#00d4ff"/>
    <rect x="448" y="150" width="104" height="32" rx="6" fill="#00d4ff"/>
  </g>

  <!-- Annotation -->
  <text x="360" y="400" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#67e8f9" opacity="0.5">Tx C to verify: only H_D, H_AB, Root needed (log2 path)</text>
</svg>
