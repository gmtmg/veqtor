<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0e0e18"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <!-- Rising cost arrow -->
  <g opacity="0.15">
    <line x1="120" y1="240" x2="520" y2="100" stroke="#ef4444" stroke-width="3"/>
    <polygon points="520,100 505,118 530,115" fill="#ef4444"/>
  </g>
  <!-- Flat price line -->
  <line x1="120" y1="180" x2="520" y2="180" stroke="#10b981" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.4"/>
  <text x="535" y="184" font-family="monospace" font-size="8" fill="#10b981" opacity="0.5">$5/$25</text>
  <!-- Token count bars (before) -->
  <g opacity="0.5">
    <rect x="160" y="200" width="30" height="50" rx="3" fill="#a855f7" opacity="0.3"/>
    <rect x="200" y="190" width="30" height="60" rx="3" fill="#a855f7" opacity="0.3"/>
    <rect x="240" y="195" width="30" height="55" rx="3" fill="#a855f7" opacity="0.3"/>
    <text x="215" y="268" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a855f7" opacity="0.7">4.6</text>
  </g>
  <!-- Token count bars (after - taller) -->
  <g opacity="0.5">
    <rect x="370" y="175" width="30" height="75" rx="3" fill="#ef4444" opacity="0.3"/>
    <rect x="410" y="158" width="30" height="92" rx="3" fill="#ef4444" opacity="0.3"/>
    <rect x="450" y="150" width="30" height="100" rx="3" fill="#ef4444" opacity="0.4"/>
    <text x="425" y="268" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ef4444" opacity="0.7">4.7</text>
  </g>
  <!-- +35% label -->
  <g>
    <rect x="380" y="120" width="70" height="24" rx="12" fill="#ef4444" opacity="0.15"/>
    <text x="415" y="136" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444" opacity="0.9">+35%</text>
  </g>
  <!-- Arrow between groups -->
  <line x1="290" y1="220" x2="355" y2="220" stroke="#888" stroke-width="1" opacity="0.3"/>
  <polygon points="355,220 348,216 348,224" fill="#888" opacity="0.3"/>
  <!-- Category badge -->
  <rect x="258" y="42" width="124" height="22" rx="11" fill="#ef4444" opacity="0.12"/>
  <text x="320" y="57" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#ef4444" opacity="0.8">COST ANALYSIS</text>
  <!-- Title text -->
  <text x="320" y="305" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" opacity="0.9">OPUS 4.7 TOKENIZER CHANGE</text>
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888" opacity="0.6">Same price, more tokens = stealth cost increase</text>
</svg>
