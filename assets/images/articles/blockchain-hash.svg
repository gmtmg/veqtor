<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff" opacity="0.7">HASH FUNCTION</text>
  <!-- LEFT: Input data -->
  <g transform="translate(160,120)">
    <rect x="-110" y="-30" width="220" height="60" rx="8" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.7"/>
    <text x="0" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#a78bfa" opacity="0.8">INPUT</text>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="12" fill="#fff" opacity="0.9">"Hello, Blockchain!"</text>
  </g>
  <!-- Hash function box (center) -->
  <g transform="translate(400,120)">
    <rect x="-55" y="-30" width="110" height="60" rx="10" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="2" opacity="0.8"/>
    <text x="0" y="-6" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00d4ff" opacity="0.9">SHA-256</text>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="8" fill="#a78bfa" opacity="0.6">Hash Func</text>
  </g>
  <!-- Arrow: input → hash -->
  <line x1="270" y1="120" x2="345" y2="120" stroke="url(#arrowGrad)" stroke-width="2" opacity="0.6"/>
  <polygon points="345,120 337,115 337,125" fill="#7c3aed" opacity="0.6"/>
  <!-- RIGHT: Output hash -->
  <g transform="translate(640,120)">
    <rect x="-120" y="-30" width="240" height="60" rx="8" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
    <text x="0" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#67e8f9" opacity="0.8">OUTPUT</text>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff" opacity="0.9">2cf24dba5fb0a30e...</text>
  </g>
  <!-- Arrow: hash → output -->
  <line x1="455" y1="120" x2="520" y2="120" stroke="url(#arrowGrad)" stroke-width="2" opacity="0.6"/>
  <polygon points="520,120 512,115 512,125" fill="#00d4ff" opacity="0.6"/>
  <!-- Divider -->
  <line x1="100" y1="185" x2="700" y2="185" stroke="#fff" stroke-width="0.5" opacity="0.08"/>
  <text x="400" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff" opacity="0.5">1文字変えるだけでハッシュが激変（雪崩効果）</text>
  <!-- Bottom: Avalanche effect demo -->
  <!-- Input 2 (changed 1 char) -->
  <g transform="translate(160,280)">
    <rect x="-110" y="-30" width="220" height="60" rx="8" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
    <text x="0" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#fca5a5" opacity="0.8">INPUT (1文字変更)</text>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="12" fill="#fff" opacity="0.9">"Hello, Blockchain<tspan fill="#ff6b6b" font-weight="bold">.</tspan>"</text>
  </g>
  <!-- Hash function box 2 -->
  <g transform="translate(400,280)">
    <rect x="-55" y="-30" width="110" height="60" rx="10" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="2" opacity="0.8"/>
    <text x="0" y="-6" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00d4ff" opacity="0.9">SHA-256</text>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="8" fill="#a78bfa" opacity="0.6">Hash Func</text>
  </g>
  <!-- Arrow 2 -->
  <line x1="270" y1="280" x2="345" y2="280" stroke="#ff6b6b" stroke-width="2" opacity="0.5"/>
  <polygon points="345,280 337,275 337,285" fill="#ff6b6b" opacity="0.5"/>
  <!-- Output 2 (completely different) -->
  <g transform="translate(640,280)">
    <rect x="-120" y="-30" width="240" height="60" rx="8" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
    <text x="0" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#fca5a5" opacity="0.8">OUTPUT (完全に異なる!)</text>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff" opacity="0.9">e9d71f5ee7c92d63...</text>
  </g>
  <!-- Arrow 2 output -->
  <line x1="455" y1="280" x2="520" y2="280" stroke="#ff6b6b" stroke-width="2" opacity="0.5"/>
  <polygon points="520,280 512,275 512,285" fill="#ff6b6b" opacity="0.5"/>
  <!-- "Not equal" indicator between the two outputs -->
  <g transform="translate(640,200)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#ff6b6b" opacity="0.6">&#8800;</text>
  </g>
  <!-- Bottom note -->
  <text x="400" y="370" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888" opacity="0.4">入力が少しでも変われば、出力は完全に別物になる</text>
</svg>
