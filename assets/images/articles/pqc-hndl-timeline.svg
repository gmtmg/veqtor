<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080f"/>
      <stop offset="100%" stop-color="#0c0c1a"/>
    </linearGradient>
    <linearGradient id="dangerZone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff3c3c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ff3c3c" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
  </g>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" opacity="0.9">HNDL攻撃 ― Harvest Now, Decrypt Later</text>
  <text x="400" y="52" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#888" opacity="0.5">「今盗んで、後で解読する」攻撃のタイムライン</text>
  <!-- Timeline axis -->
  <line x1="60" y1="160" x2="740" y2="160" stroke="#fff" stroke-width="1.5" opacity="0.2"/>
  <!-- Danger zone background -->
  <rect x="500" y="70" width="240" height="200" fill="url(#dangerZone)" rx="4"/>
  <!-- Timeline markers -->
  <!-- NOW (2026) -->
  <g transform="translate(160,160)">
    <line x1="0" y1="-70" x2="0" y2="10" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="6" fill="#0a0a18" stroke="#00d4ff" stroke-width="2"/>
    <text x="0" y="-80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#00d4ff" opacity="0.9">現在</text>
    <text x="0" y="-66" text-anchor="middle" font-family="monospace" font-size="9" fill="#00d4ff" opacity="0.5">2026</text>
  </g>
  <!-- HARVEST phase -->
  <g>
    <rect x="120" y="175" width="200" height="40" rx="4" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>
    <rect x="120" y="175" width="200" height="40" rx="4" fill="#f59e0b" opacity="0.05"/>
    <text x="220" y="193" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f59e0b" opacity="0.8">HARVEST（収集）</text>
    <text x="220" y="208" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f59e0b" opacity="0.5">暗号化データを大量収集・保存</text>
  </g>
  <!-- Attacker icon -->
  <g transform="translate(100,190)">
    <circle cx="0" cy="-8" r="5" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <path d="M-8,5 L0,-2 L8,5" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Data packets flowing to storage -->
  <g opacity="0.4" fill="#f59e0b">
    <rect x="340" y="180" width="8" height="5" rx="1"/><rect x="355" y="186" width="8" height="5" rx="1"/>
    <rect x="340" y="192" width="8" height="5" rx="1"/><rect x="355" y="198" width="8" height="5" rx="1"/>
    <rect x="340" y="204" width="8" height="5" rx="1"/>
  </g>
  <!-- WAIT phase (arrow) -->
  <g>
    <line x1="370" y1="195" x2="490" y2="195" stroke="#888" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
    <text x="430" y="185" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888" opacity="0.4">保存して待つ…</text>
  </g>
  <!-- Q-DAY marker -->
  <g transform="translate(560,160)">
    <line x1="0" y1="-70" x2="0" y2="10" stroke="#ff3c3c" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="6" fill="#0a0a18" stroke="#ff3c3c" stroke-width="2"/>
    <text x="0" y="-80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ff3c3c" opacity="0.9">Q-Day</text>
    <text x="0" y="-66" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff3c3c" opacity="0.5">2029〜2035?</text>
  </g>
  <!-- DECRYPT phase -->
  <g>
    <rect x="500" y="175" width="200" height="40" rx="4" fill="none" stroke="#ff3c3c" stroke-width="1.5" opacity="0.4"/>
    <rect x="500" y="175" width="200" height="40" rx="4" fill="#ff3c3c" opacity="0.05"/>
    <text x="600" y="193" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ff3c3c" opacity="0.8">DECRYPT（解読）</text>
    <text x="600" y="208" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ff3c3c" opacity="0.5">量子コンピュータで一括復号</text>
  </g>
  <!-- Bottom explanation boxes -->
  <g transform="translate(160,260)">
    <rect x="-80" y="0" width="160" height="50" rx="4" fill="none" stroke="#f59e0b" stroke-width="0.8" opacity="0.3"/>
    <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f59e0b" opacity="0.7">国家機密・医療データ</text>
    <text x="0" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f59e0b" opacity="0.7">金融情報・個人情報</text>
    <text x="0" y="44" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#888" opacity="0.4">暗号化されていても収集される</text>
  </g>
  <g transform="translate(560,260)">
    <rect x="-80" y="0" width="160" height="50" rx="4" fill="none" stroke="#ff3c3c" stroke-width="0.8" opacity="0.3"/>
    <text x="0" y="18" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ff3c3c" opacity="0.7">RSA/ECCの暗号が</text>
    <text x="0" y="32" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ff3c3c" opacity="0.7">数時間で解読可能に</text>
    <text x="0" y="44" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#888" opacity="0.4">過去のデータも全て危険</text>
  </g>
  <!-- Warning -->
  <text x="400" y="345" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#ff6b6b" opacity="0.6">この攻撃は「今」すでに始まっている</text>
</svg>
