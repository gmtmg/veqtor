<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0e0e18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.04" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <!-- User chat bubble (left) -->
  <g transform="translate(160,110)" opacity="0.7">
    <rect x="-50" y="-22" width="100" height="44" rx="22" fill="none" stroke="#00d4ff" stroke-width="1.8"/>
    <polygon points="-20,22 -10,22 -18,34" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
    <!-- Typing lines -->
    <line x1="-30" y1="-6" x2="30" y2="-6" stroke="#00d4ff" stroke-width="1.2" opacity="0.5"/>
    <line x1="-30" y1="4" x2="16" y2="4" stroke="#00d4ff" stroke-width="1.2" opacity="0.5"/>
  </g>
  <!-- Arrow from user to AI -->
  <g opacity="0.35">
    <line x1="225" y1="120" x2="345" y2="120" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="5,3"/>
    <polygon points="345,116 355,120 345,124" fill="#a855f7" opacity="0.6"/>
  </g>
  <!-- AI response bubble (right) -->
  <g transform="translate(470,110)" opacity="0.7">
    <rect x="-60" y="-30" width="120" height="60" rx="12" fill="none" stroke="#a855f7" stroke-width="1.8"/>
    <polygon points="50,30 40,30 48,42" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <!-- Response lines -->
    <line x1="-40" y1="-14" x2="40" y2="-14" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
    <line x1="-40" y1="-4" x2="36" y2="-4" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
    <line x1="-40" y1="6" x2="30" y2="6" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
    <line x1="-40" y1="16" x2="20" y2="16" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- Sparkle / magic stars around AI bubble -->
  <g opacity="0.5">
    <circle cx="530" cy="75" r="2" fill="#a855f7"/>
    <circle cx="400" cy="85" r="1.5" fill="#00d4ff"/>
    <circle cx="550" cy="150" r="1.8" fill="#a855f7" opacity="0.4"/>
    <circle cx="140" cy="80" r="1.5" fill="#00d4ff" opacity="0.4"/>
    <circle cx="290" cy="100" r="1.2" fill="#fff" opacity="0.3"/>
  </g>
  <!-- Prompt engineering symbols: pencil icon -->
  <g transform="translate(100,175)" opacity="0.35">
    <line x1="0" y1="0" x2="18" y2="-18" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="-18" x2="22" y2="-14" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="22" y1="-14" x2="4" y2="4" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4" y2="4" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Checkmark icon -->
  <g transform="translate(540,175)" opacity="0.35">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <polyline points="-6,0 -2,5 7,-5" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Glow orbs -->
  <circle cx="160" cy="110" r="60" fill="#00d4ff" opacity="0.03"/>
  <circle cx="470" cy="110" r="70" fill="#a855f7" opacity="0.03"/>
  <!-- Bottom labels -->
  <text x="160" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#00d4ff" opacity="0.55">Your Prompt</text>
  <text x="470" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a855f7" opacity="0.55">AI Output</text>
  <!-- Title text -->
  <text x="320" y="275" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" opacity="0.9">Prompt Engineering</text>
  <text x="320" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888" opacity="0.6">Guide for Beginners</text>
  <!-- Accent line -->
  <line x1="200" y1="325" x2="440" y2="325" stroke="url(#accent)" stroke-width="1.5" opacity="0.3"/>
</svg>
