<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060b"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <radialGradient id="glowL" cx="25%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glowR" cx="75%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="60" x2="640" y2="60"/><line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/><line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80" y1="0" x2="80" y2="360"/><line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/><line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/><line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>
  <rect width="640" height="360" fill="url(#glowL)"/>
  <rect width="640" height="360" fill="url(#glowR)"/>

  <!-- Shield (center-left) -->
  <g transform="translate(280,140)">
    <path d="M0,-45 L30,-30 L30,10 Q30,40 0,50 Q-30,40 -30,10 L-30,-30 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="2" opacity="0.85"/>
    <path d="M0,-35 L22,-23 L22,8 Q22,30 0,38 Q-22,30 -22,8 L-22,-23 Z" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.3"/>
    <!-- Checkmark inside shield -->
    <path d="M-10,2 L-3,10 L12,-8" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Gear (center-right) -->
  <g transform="translate(370,140)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#gearGrad)" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="5" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.6"/>
    <!-- Gear teeth -->
    <g stroke="url(#gearGrad)" stroke-width="2" opacity="0.8">
      <line x1="0" y1="-14" x2="0" y2="-20"/>
      <line x1="12" y1="-7" x2="17" y2="-10"/>
      <line x1="14" y1="0" x2="20" y2="0"/>
      <line x1="12" y1="7" x2="17" y2="10"/>
      <line x1="0" y1="14" x2="0" y2="20"/>
      <line x1="-12" y1="7" x2="-17" y2="10"/>
      <line x1="-14" y1="0" x2="-20" y2="0"/>
      <line x1="-12" y1="-7" x2="-17" y2="-10"/>
    </g>
  </g>

  <!-- Pattern icons around -->
  <!-- Factory (top-left) -->
  <g transform="translate(140,100)" opacity="0.5">
    <rect x="-15" y="-10" width="30" height="20" rx="2" fill="none" stroke="#a78bfa" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-family="monospace" font-size="6" fill="#a78bfa">Factory</text>
    <line x1="-5" y1="-10" x2="-5" y2="-16" stroke="#a78bfa" stroke-width="0.8"/>
    <line x1="5" y1="-10" x2="5" y2="-14" stroke="#a78bfa" stroke-width="0.8"/>
  </g>

  <!-- Proxy (top-right) -->
  <g transform="translate(500,95)" opacity="0.5">
    <rect x="-15" y="-10" width="30" height="20" rx="2" fill="none" stroke="#60a5fa" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-family="monospace" font-size="6" fill="#60a5fa">Proxy</text>
    <line x1="18" y1="0" x2="28" y2="0" stroke="#60a5fa" stroke-width="0.8" stroke-dasharray="2,2"/>
    <rect x="28" y="-6" width="12" height="12" rx="1" fill="none" stroke="#60a5fa" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- ERC-20 (bottom-left) -->
  <g transform="translate(150,200)" opacity="0.45">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="7" fill="#f59e0b">ERC</text>
  </g>

  <!-- Lock icon (bottom-right) -->
  <g transform="translate(490,195)" opacity="0.45">
    <rect x="-8" y="-2" width="16" height="12" rx="2" fill="none" stroke="#ef4444" stroke-width="1"/>
    <path d="M-4,-2 L-4,-7 A4,4 0 0 1 4,-7 L4,-2" fill="none" stroke="#ef4444" stroke-width="1"/>
    <circle cx="0" cy="5" r="1.5" fill="#ef4444" opacity="0.6"/>
  </g>

  <!-- Test icon (left) -->
  <g transform="translate(120,160)" opacity="0.35">
    <text x="0" y="0" text-anchor="middle" font-family="monospace" font-size="10" fill="#10b981">&#x2713;</text>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-size="5" fill="#10b981">Test</text>
  </g>

  <!-- Audit icon (right) -->
  <g transform="translate(520,155)" opacity="0.35">
    <rect x="-8" y="-10" width="16" height="20" rx="1" fill="none" stroke="#f59e0b" stroke-width="0.8"/>
    <line x1="-4" y1="-5" x2="4" y2="-5" stroke="#f59e0b" stroke-width="0.5"/>
    <line x1="-4" y1="-1" x2="4" y2="-1" stroke="#f59e0b" stroke-width="0.5"/>
    <line x1="-4" y1="3" x2="2" y2="3" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="0" y="20" text-anchor="middle" font-family="monospace" font-size="5" fill="#f59e0b">Audit</text>
  </g>

  <!-- Connecting dashed lines -->
  <line x1="170" y1="105" x2="250" y2="130" stroke="#a78bfa" stroke-width="0.6" opacity="0.12" stroke-dasharray="4,3"/>
  <line x1="485" y1="100" x2="400" y2="130" stroke="#60a5fa" stroke-width="0.6" opacity="0.12" stroke-dasharray="4,3"/>
  <line x1="165" y1="200" x2="250" y2="155" stroke="#f59e0b" stroke-width="0.6" opacity="0.12" stroke-dasharray="4,3"/>
  <line x1="475" y1="195" x2="400" y2="155" stroke="#ef4444" stroke-width="0.6" opacity="0.12" stroke-dasharray="4,3"/>

  <!-- Title -->
  <text x="320" y="268" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" opacity="0.9">SMART CONTRACT PATTERNS</text>
  <text x="320" y="290" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#888" opacity="0.5">Design, Security, Testing &amp; Audit</text>
  <!-- Top label -->
  <text x="320" y="42" text-anchor="middle" font-family="monospace" font-size="7" fill="#a78bfa" opacity="0.4">SOLIDITY DESIGN PATTERNS</text>
</svg>
