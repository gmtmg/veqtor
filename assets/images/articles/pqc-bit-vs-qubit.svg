<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080f"/>
      <stop offset="100%" stop-color="#0c0c1a"/>
    </linearGradient>
    <radialGradient id="qubitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
  <!-- LEFT SIDE: Classical Bit -->
  <text x="200" y="50" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ff6b6b" opacity="0.9">Classical Bit</text>
  <!-- Coin showing heads (0) -->
  <g transform="translate(130,190)">
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <text x="0" y="15" text-anchor="middle" font-family="monospace" font-size="48" font-weight="bold" fill="#ff6b6b" opacity="0.8">0</text>
    <text x="0" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ff6b6b" opacity="0.5">表 (OFF)</text>
  </g>
  <!-- OR label -->
  <text x="200" y="195" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#888" opacity="0.5">or</text>
  <!-- Coin showing tails (1) -->
  <g transform="translate(270,190)">
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="none" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <text x="0" y="15" text-anchor="middle" font-family="monospace" font-size="48" font-weight="bold" fill="#ff6b6b" opacity="0.8">1</text>
    <text x="0" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ff6b6b" opacity="0.5">裏 (ON)</text>
  </g>
  <text x="200" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#aaa" opacity="0.6">表か裏、どちらか一方だけ</text>
  <text x="200" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#aaa" opacity="0.6">= 0 か 1 のどちらか</text>
  <!-- Center divider -->
  <line x1="400" y1="30" x2="400" y2="370" stroke="#fff" stroke-width="0.5" opacity="0.1"/>
  <text x="400" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff" opacity="0.2">VS</text>
  <!-- RIGHT SIDE: Qubit -->
  <text x="600" y="50" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#00d4ff" opacity="0.9">Qubit (量子ビット)</text>
  <!-- Spinning coin (superposition) -->
  <g transform="translate(600,185)">
    <circle cx="0" cy="0" r="60" fill="url(#qubitGlow)"/>
    <!-- Bloch sphere representation -->
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="55" ry="18" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
    <!-- Axis -->
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#fff" stroke-width="0.5" opacity="0.15"/>
    <!-- State vector arrow -->
    <line x1="0" y1="0" x2="32" y2="-42" stroke="#00d4ff" stroke-width="2.5" opacity="0.8"/>
    <circle cx="32" cy="-42" r="4" fill="#00d4ff" opacity="0.9"/>
    <!-- Labels for |0⟩ and |1⟩ -->
    <text x="0" y="-66" text-anchor="middle" font-family="monospace" font-size="12" fill="#00d4ff" opacity="0.6">|0⟩</text>
    <text x="0" y="78" text-anchor="middle" font-family="monospace" font-size="12" fill="#7c3aed" opacity="0.6">|1⟩</text>
    <!-- Rotation arrows (showing spinning) -->
    <path d="M42,8 A45,45 0 0,1 20,40" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
    <polygon points="20,40 25,35 17,36" fill="#7c3aed" opacity="0.4"/>
    <path d="M-42,-8 A45,45 0 0,1 -20,-40" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
    <polygon points="-20,-40 -25,-35 -17,-36" fill="#7c3aed" opacity="0.4"/>
    <!-- Superposition notation -->
    <text x="0" y="100" text-anchor="middle" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.7">α|0⟩ + β|1⟩</text>
  </g>
  <text x="600" y="310" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#aaa" opacity="0.6">回転するコイン = 重ね合わせ</text>
  <text x="600" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#aaa" opacity="0.6">0と1を同時に持つ</text>
  <!-- Bottom comparison -->
  <g opacity="0.4">
    <text x="200" y="370" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff6b6b">1つの値 = 1つの計算</text>
    <text x="600" y="370" text-anchor="middle" font-family="monospace" font-size="9" fill="#00d4ff">2^n の状態を同時に探索</text>
  </g>
</svg>
